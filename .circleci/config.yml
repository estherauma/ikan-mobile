version: 2.1

jobs:
  build-apk:
    docker:
      # - image: cimg/node:18.12.1 has the correct versio of node
      - image: cimg/android:2022.09-node
    environment:
        JVM_OPTS: -Xmx3200m
    steps:
      - checkout
      - run:
          name: "Install gradle"
          command: |
            wget https://services.gradle.org/distributions/gradle-4.0.2-bin.zip -P /tmp
            sudo unzip -d /opt/gradle /tmp/gradle-*.zip
            echo 'export GRADLE_HOME=/opt/gradle/gradle-4.0.2' >> $BASH_ENV
            echo 'export PATH=$PATH:/opt/gradle/gradle-4.0.2/bin' >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Install dependencies
          command: |
            node -v
            npm install
            sudo npm i -g @ionic/cli
            sudo npm install -g codecov
      - run:
          name: Ionic Build
          command: |
            ionic build
            npx cap sync android
      - run:
          name: Store Google Services Account
          command: |
            cd android/app
            echo $GOOGLE_SERVICES_ACCOUNT | base64 -d > google-services.json
      - run:
          name: Download Dependencies
          command: |
            cd android
            ./gradlew androidDependencies
      - run:
          name: Build debug APK
          command: |
            cd android
            ./gradlew :app:assemble
      - store_artifacts:
          path: android/app/build/outputs/apk/debug

  build-and-release-apk:
    docker:
      - image: cimg/android:2022.09-node
    environment:
        JVM_OPTS: -Xmx3200m
    steps:
      - checkout
      - run:
          name: "Install gradle"
          command: |
            wget https://services.gradle.org/distributions/gradle-4.0.2-bin.zip -P /tmp
            sudo unzip -d /opt/gradle /tmp/gradle-*.zip
            echo 'export GRADLE_HOME=/opt/gradle/gradle-4.0.2' >> $BASH_ENV
            echo 'export PATH=$PATH:/opt/gradle/gradle-4.0.2/bin' >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Install dependencies
          command: |
            npm install
            sudo npm i -g @ionic/cli
            sudo npm install -g codecov
      - run:
          name: Ionic Build
          command: |
            ionic build
            npx cap sync android
      - run:
          name: Store Google Services Account
          command: |
            cd android/app
            echo $GOOGLE_SERVICES_ACCOUNT | base64 -d > google-services.json
      - run:
          name: Download Dependencies
          command: |
            cd android
            ./gradlew androidDependencies
      - run:
          name: Build debug APK
          command: |
            cd android
            ./gradlew :app:assemble
      - store_artifacts:
          path: android/app/build/outputs/apk/debug

      - run:
          name: Publish debug apk to Firebase Distribution
          command: |
            cd android/
            echo $GOOGLE_APPLICATION_CREDENTIALS_CONTENT | base64 -d > google-application-credentials.json
            ./gradlew assembleDebug appDistributionUploadDebug

workflows:
  version: 2
  build-test-and-generate-apk:
    jobs:
      - build-apk:
          filters:
            branches:
              ignore:
                - dev
                - staging
                - main

  # All pushes to any branch are going to result into apks being pushed to firebase for testing.
  # Ignoring staging and main because we'd have already tested on the feature branches and on dev
  # TODO: Revert this later when we don't need a lot of testing to happen
  build-test-generate-release-firebase-apk:
    jobs:
      - build-and-release-apk:
          filters:
            branches:
              only:
                - dev
                - staging
                - main
              # ignore:
              #   - staging
              #   - main
