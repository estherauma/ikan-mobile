version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2025.08.1-node
    environment:
        JVM_OPTS: -Xmx3200m
    steps:
      - checkout
      - run:
          name: "Install gradle"
          command: |
            wget https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -P /tmp
            sudo unzip -d /opt/gradle /tmp/gradle-*.zip
            echo 'export GRADLE_HOME=/opt/gradle/gradle-8.11.1' >> $BASH_ENV
            echo 'export PATH=$PATH:/opt/gradle/gradle-8.11.1/bin' >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Install dependencies
          command: |
            node -v
            npm install
            sudo npm i -g @ionic/cli
            sudo npm install -g codecov
      - run:
          name: Ionic Build
          command: |
            export NODE_OPTIONS=--max_old_space_size=4096
            if [ "$CIRCLE_BRANCH" = "refs/heads/main" ]; then
              ionic build --configuration=production
            elif [ "$CIRCLE_BRANCH" = "refs/heads/staging" ]; then
              ionic build --configuration=staging
            else
              ionic build
            fi
            npx cap sync android
      - run:
          name: Store Google Services Account
          command: |
            cd android/app
            echo $GOOGLE_SERVICES_ACCOUNT | base64 -d > google-services.json
      - run:
          name: Download Dependencies
          command: |
            cd android
            ./gradlew androidDependencies
      - run:
          name: Build debug APK
          command: |
            cd android
            ./gradlew :app:assembleDebug
      - store_artifacts:
          path: android/app/build/outputs/apk/debug

  build-and-release-apk:
    docker:
      - image: cimg/android:2025.08.1-node
    environment:
        JVM_OPTS: -Xmx3200m
    steps:
      - checkout
      - run:
          name: "Install gradle"
          command: |
            wget https://services.gradle.org/distributions/gradle-4.0.2-bin.zip -P /tmp
            sudo unzip -d /opt/gradle /tmp/gradle-*.zip
            echo 'export GRADLE_HOME=/opt/gradle/gradle-4.0.2' >> $BASH_ENV
            echo 'export PATH=$PATH:/opt/gradle/gradle-4.0.2/bin' >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Install dependencies
          command: |
            npm install
            sudo npm i -g @ionic/cli
            sudo npm install -g codecov
      - run:
          name: Ionic Build
          command: |
            export NODE_OPTIONS=--max_old_space_size=4096
            ionic build
            npx cap sync android
      - run:
          name: Store Google Services Account
          command: |
            cd android/app
            echo $GOOGLE_SERVICES_ACCOUNT | base64 -d > google-services.json
            echo $GOOGLE_APPLICATION_CREDENTIALS_CONTENT | base64 -d > google-services-credentials.json
      - run:
          name: Download Dependencies
          command: |
            cd android
            ./gradlew androidDependencies
      - run:
          name: Build debug APK
          command: |
            cd android
            ./gradlew :app:assembleDebug
      - store_artifacts:
          path: android/app/build/outputs/apk/debug

      - run:
          name: Publish debug apk to Firebase Distribution
          command: |
            cd android
            ./gradlew assembleDebug appDistributionUploadDebug

workflows:
  version: 2
  build-test-and-generate-apk:
    jobs:
      - build-apk:
          filters:
            branches:
              ignore:
                - dev
                - staging
                - main

  build-test-generate-release-firebase-apk:
    jobs:
      - build-and-release-apk:
          filters:
            branches:
              only:
                - dev
                - staging
                - main
