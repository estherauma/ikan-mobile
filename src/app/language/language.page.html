<app-header></app-header>

<ion-content>
  <ion-row class="page-title-row">
    <ion-col size="12">
      <h1>{{ pageTitle }}</h1>
    </ion-col>
  </ion-row>

  <div class="list-wrapper">
    <ion-grid>
      <ion-radio-group (ionChange)="changeLanguage($event)" value="{{currentLanguage}}">
        @for (item of availableLanguages; track item) {
          <ion-row>
            <ion-col size="12">
              @if (item.key) {
                <ion-item fill="clear">
                  <ion-label text-wrap>{{ item?.label }}</ion-label>
                  <ion-radio mode="md" slot="end" value="{{item?.localeCode}}"></ion-radio>
                </ion-item>
              }
            </ion-col>
          </ion-row>
        }
      </ion-radio-group>
    </ion-grid>
  </div>

  <div class="submit-btn-wrapper">
    <ion-button
      fill="solid"
      [disabled]="!isLanguageSelected"
      (click)="onSubmit()"
      >
      {{ 'Submit' }}
    </ion-button>
  </div>

</ion-content>
