<app-header [pageTitle] = "pageTitle"></app-header>

<ion-content>
  <div id="list_wrapper">
    <ion-grid>
      <ion-radio-group (ionChange)="changeLanguage($event)" value="{{currentLanguage}}">
        <ion-row *ngFor="let item of availableLanguages">
          <ion-col size="12">
            <ion-item *ngIf="item.key" fill="clear">
              <ion-label text-wrap>{{ item?.label }}</ion-label>
              <ion-radio mode="md" slot="end" value="{{item?.localeCode}}"></ion-radio>
            </ion-item>
          </ion-col>
        </ion-row>
      </ion-radio-group>
    </ion-grid>
  </div>

</ion-content>
