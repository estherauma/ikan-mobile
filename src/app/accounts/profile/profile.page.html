<app-header pageTitle=""></app-header>

<ion-content [fullscreen]="true">
  <div class="profile-image">
    <ion-row class="ion-padding-bottom title">
      <app-title [isBlue]="true" [title]="pageTitle"></app-title>
    </ion-row>

    <ion-row>
      <ion-col size="3" class="img-wrapper">
          <ion-icon *ngIf="!imageUrl" class="image icon" name="person-circle-outline" />
          <img *ngIf="imageUrl" class="image img" [src]="imageUrl || '/assets/icon/ellipse_profile.svg'" />
      </ion-col>
    </ion-row>
  </div>

  <div class="profile">
    <app-form
      class="profile-form"
      [tunaFormGroup]="pageFormGroup"
      [tunaFormquestions]="formQuestions"
      [submitButtonText]="submitButtonText"
      (formValue)="onSubmit($event)"
    >
    </app-form>
  </div>
  <div *ngIf="isAgent" class="registration-details-form">
    <app-form
      class="registration-details-form"
      [tunaFormGroup]="regFormGroup"
      [tunaFormquestions]="regFormQtns"
      [submitButtonText]="submitButtonText"
      (formValue)="onSubmitRegDetails($event)"
    >
    </app-form>
  </div>
</ion-content>
