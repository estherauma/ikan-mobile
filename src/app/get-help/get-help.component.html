<app-header></app-header>
<ion-content>
  <div class="content-wrapper">
    <h4 class="page-title">{{ allContent?.pageTitle }}</h4>

    <ion-row class="disclaimer-wrapper">
      <ion-col size="3" class="icon-wrapper">
        <ion-icon src="assets/icon/Privacy.svg"></ion-icon>
      </ion-col>
      <ion-col size=9>
        <p>{{ allContent?.disclaimerText }}</p>
      </ion-col>
    </ion-row>
    
    <div class="content-section">
      @for (section of pageContent; track section) {
        <div>
          @if (section?.type === 'text_area') {
            <shared-text-area
              [data]="section"
              styles="textarea"
            ></shared-text-area>
            
            <!-- check if this is not the last text_area in pagecontent -->
            @if (!isLastTextAreaSection(pageContent?.indexOf(section))) {
              <hr />
            }
          }
          @if (section?.type === 'drop_down_content') {
            <shared-drop-down
              [data]="section"
              styles="drop-down"
            ></shared-drop-down>
          }
        </div>
      }
    </div>
  </div>
</ion-content>
