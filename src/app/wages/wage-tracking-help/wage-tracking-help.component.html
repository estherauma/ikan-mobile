<app-header></app-header>

<ion-content [fullscreen]="true">
  <div class="title-section">
    <!-- TODO: translate -->
     <p>We've noted your response.</p>
  </div>
  
  <div class="info-section">
    <ion-icon name="bulb-outline" class="bulb-icon"></ion-icon>
    <p>Want to ask a question or need help? Here are some options.</p>
    <ion-button (click)="goToLearningHubWages()">Read FAQ on wages</ion-button>
    <p>{{ commonText?.or || 'or' }}</p>
    <p>Show me contact details for:</p>
    <ion-button (click)="goToContractDetails()">My employer</ion-button>
    <ion-button (click)="showAgentDetails()">My manning agent</ion-button>
    <ion-button (click)="goToHelp()">Trade Union / NGOs / Government</ion-button>
  </div>

  <div class="skip-section">
    <ion-button (click)="onSkip()">{{ commonText?.skip }}</ion-button>
  </div>
</ion-content>
