<app-header [pageTitle]="pageTitle"></app-header>

<ion-content [fullscreen]="true">
  <ion-text>
    <app-title [isBlue]="true" [title]="pageTitle"></app-title>
  </ion-text>

  <div class="content-section">
    <div *ngFor="let section of pageContent">
      <!-- text area type -->
      <shared-text-area
        *ngIf="section?.type === 'text_area'"
        [data]="section"
        styles="textarea"
      ></shared-text-area>
    </div>
  </div>
</ion-content>
