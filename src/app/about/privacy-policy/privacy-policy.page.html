<app-header [showMenuButton]="showMenuButton" ></app-header>

<ion-content>
  <ion-text>
    <app-title [isBlue]="true" [title]="pageTitle"></app-title>
  </ion-text>

  <div class="content-section">
    @for (section of pageContent; track section) {
      <div>
        <!-- text area type -->
        @if (section?.type === 'text_area') {
          <shared-text-area
            [data]="section"
            styles="textarea"
          ></shared-text-area>
        }
      </div>
    }
  </div>
</ion-content>
