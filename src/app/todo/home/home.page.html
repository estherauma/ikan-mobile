<app-header [pageTitle]=""></app-header>

<ion-content>
<ion-thumbnail style="width: 100%; height: 20vh;">
  <ion-img  src=""></ion-img>
</ion-thumbnail>
<div>
  <ion-row>
    <ion-col>
      <ion-card (click)="onNew()">
        <ion-card-content>
          <ion-thumbnail>
            <ion-img src=""></ion-img>
          </ion-thumbnail>
          <ion-card-title>New</ion-card-title>
          <ion-card-subtitle>(4)</ion-card-subtitle>
        </ion-card-content>
      </ion-card>
    </ion-col>
    <ion-col>
      <ion-card (click)="onList()">
        <ion-card-content>
          <ion-thumbnail>
            <ion-img src=""></ion-img>
          </ion-thumbnail>
          <ion-card-title>My List</ion-card-title>
          <ion-card-subtitle>(8/42)</ion-card-subtitle>
        </ion-card-content>
      </ion-card>
    </ion-col>
  </ion-row>
  <ion-card (click)="goToPlacement()">
    <ion-card-content>
      <ion-row>
        <ion-col size="3">
          <ion-thumbnail>
            <ion-img src=""></ion-img>
          </ion-thumbnail>
        </ion-col>
        <ion-col>
          <ion-card-title>Placement</ion-card-title>
        </ion-col>
    </ion-row>
    </ion-card-content>
  </ion-card>
  <ion-card>
    <ion-card-content>
      <ion-card-title>My Badges</ion-card-title>
      <ion-row>
        <ion-col *ngFor="let badge of badges" size="3">
          <ion-row class="ion-align-items-center ion-justify-content-center">
            <ion-col size="12">
              <ion-thumbnail>
                <ion-img src=""></ion-img>
              </ion-thumbnail>
            </ion-col>
            <ion-col size="12">
              <ion-card-subtitle>{{badge.name}}</ion-card-subtitle>
              <ion-card-subtitle>{{badge.date}}</ion-card-subtitle>
            </ion-col>
          </ion-row>
        </ion-col>
      </ion-row>
      <a routerLink="/todo/badges">See all badges</a>
    </ion-card-content>
  </ion-card>
</div>
</ion-content>
