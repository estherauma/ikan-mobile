<app-header [pageTitle]=""></app-header>
<ion-content>
  <h1 class="ion-padding">My List</h1>
  <div class="content">
    <ion-searchbar placeholder="search work orders"></ion-searchbar>
    <ion-row class="ion-align-items-center">
      <ion-col size="4">
        <ion-row>
          <ion-col>
            <ion-label>Sort By</ion-label>
          </ion-col>
          <ion-col>
            <app-filter></app-filter>
          </ion-col>
        </ion-row>
      </ion-col>
      <ion-col size="5">
        <ion-row>
          <ion-col>
            <ion-label>Filter</ion-label>
          </ion-col>
          <ion-col>
            <app-filter></app-filter>
          </ion-col>
        </ion-row>
      </ion-col>
      <ion-col size="3">
        <a routerLink="">Archived(33)</a>
      </ion-col>
    </ion-row>
    <ion-item lines="none" *ngFor="let todo of todos">
      <ion-checkbox slot="start" ></ion-checkbox>
      <ion-card>
        <ion-card-content>
          <ion-grid>
            <ion-row class="ion-align-items-center">
              <ion-col size="2">
                <ion-icon name="expand-outline" size="large"></ion-icon>
              </ion-col>
              <ion-col size="8">
                <ion-card-title>{{todo.name}}</ion-card-title>
                <ion-label>{{todo.detail}}</ion-label>
              </ion-col>
              <ion-col size="1">
                <ion-icon name="chevron-forward-outline" size="large"></ion-icon>
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-card-content>
      </ion-card>
    </ion-item>
  </div>
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="createTodo()">
      <ion-icon name="add-circle-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
