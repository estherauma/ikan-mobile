<app-header></app-header>
<ion-content>
  <h1 class="ion-padding">My List</h1>
  <div class="content">
    <ion-searchbar placeholder="search work orders"></ion-searchbar>
    <ion-row class="ion-align-items-center">
      <ion-col size="4">
        <ion-row>
          <ion-col>
            <ion-label>Sort By</ion-label>
          </ion-col>
          <ion-col>
            <app-filter></app-filter>
          </ion-col>
        </ion-row>
      </ion-col>
      <ion-col size="5">
        <ion-row>
          <ion-col>
            <ion-label>Filter</ion-label>
          </ion-col>
          <ion-col>
            <app-filter></app-filter>
          </ion-col>
        </ion-row>
      </ion-col>
      <ion-col size="3">
        <a routerLink="">Archived(33)</a>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col *ngFor="let badge of badges" size="3">
        <ion-row (click)="badge.completed ? onDetails(true) : onDetails(false)" class="ion-align-items-center ion-justify-content-center">
          <ion-col size="12">
            <ion-thumbnail>
              <ion-img src=""></ion-img>
            </ion-thumbnail>
          </ion-col>
          <ion-col size="12">
            <ion-card-subtitle>{{badge.name}}</ion-card-subtitle>
            <ion-card-subtitle *ngIf="badge.completed">{{badge.date}}</ion-card-subtitle>
          </ion-col>
        </ion-row>
      </ion-col>
    </ion-row>
  </div>
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="createTodo()">
      <ion-icon name="add-circle-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
