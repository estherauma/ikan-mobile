<app-header> </app-header>

<ion-content class="content-skyblue-bg ion-align-items-baseline">
  <app-contentwrapper>
    <div class="ion-padding">
      <ion-grid>
        <ion-row class="ion-justify-content-between ion-align-items-baseline">
          <ion-col>
            <img src="/assets/icon/workorders_blue.svg" width="20" height="40" />
          </ion-col>
          <ion-col>
            <ion-row class="ion-justify-content-end">
              <div>
                <app-button (onClick)="createContract()" iconName="add-outline" [title]="commonText?.newContract"></app-button>
              </div>
            </ion-row>
          </ion-col>
        </ion-row>
        <ion-row class="title">
          <app-title [isBlue]="true" [title]="pageTitle"></app-title>
        </ion-row>
      </ion-grid>


    <div>
      <app-search
        [searchDataSet]="contracts"
        (searchResult)="searchResult($event)"
        (clear)="clearSearchResult()"></app-search>
      <ion-grid>
        <ion-row>
          <ion-text class="filter-title">{{ commonText?.filter}}</ion-text>
        </ion-row>
        <ion-row>
          <ion-col>
            <app-filter type="deep-blue-90"
              filterProperty="status"
              [options]="filterOptions"
              [filterDataSet]="contracts"
              (filterResult)="filterResult($event)"
            ></app-filter>
          </ion-col>

          <ion-col>
            <app-filter 
              type="deep-blue-90"
              filterProperty="status"
              [options]="filterOptions"
              [filterDataSet]="contracts"
              (filterResult)="filterResult($event)"
            ></app-filter>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>
  </div>

  <div *ngFor="let contract of contracts" >
      <app-companycontractcard
        *ngIf="contract.type === 'Company'"
        [title]="contract.name"
        [contract]="contract.taiwaneseCompany" 
        [vessel]="contract.vesselOwnerCompany" 
        [dates]="getContractDates(contract)"
      ></app-companycontractcard>
    </div>
  </app-contentwrapper>
</ion-content>
