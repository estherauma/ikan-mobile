<app-header> </app-header>

<ion-content class="content-skyblue-bg ion-align-items-baseline">
  <app-contentwrapper>
    <div class="ion-padding">
      <ion-grid>
        <ion-row class="ion-justify-content-between ion-align-items-baseline">
          <ion-col>
            <img src="/assets/icon/workorders_blue.svg" width="20" height="40" />
          </ion-col>
          <ion-col>
            <ion-row *ngIf="authService.userRole === 'vessel_owner'" class="ion-justify-content-end">
              <div>
                <app-button (onClick)="createContract()" iconName="add-outline" [title]="commonText?.newContract"></app-button>
              </div>
            </ion-row>
          </ion-col>
        </ion-row>
        <ion-row class="title">
          <app-title [isBlue]="true" [title]="pageTitle"></app-title>
        </ion-row>
      </ion-grid>


    <div>
      <app-search
        [searchDataSet]="contracts"
        (searchResult)="searchResult($event)"
        (clear)="clearSearchResult()"></app-search>
      <ion-grid>
        <ion-row>
          <ion-col size="12" size-sm="6">
            <app-filter
              type="deep-blue-90"
              [groupedOptions]="groupedFilterOptions"
              [filterDataSet]="unfilteredData"
              (filterResult)="filterResult($event)"
              [filterLabel]="commonText?.filterContracts"
            ></app-filter>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>
  </div>

  <div *ngFor="let contract of contracts" >
    <!-- User contracts -->
    <!-- <app-usercontractcard 
      [title]="contract.name"
      [contract]="contract" 
      *ngIf="contract.type !== 'Company'"
      [vessel]="contract" 
      [dates]="getContractDates(contract)">
    </app-usercontractcard> -->
    <!-- Company contracts -->
    <app-companycontractcard
      [title]="contract.name"
      [contract]="contract" 
      [vessel]="contract" 
      [dates]="getContractDates(contract)">
    </app-companycontractcard>
    </div>
  </app-contentwrapper>
</ion-content>
