<ion-toolbar class="ion-padding">
  <ion-title>{{pageTitle}}</ion-title>
</ion-toolbar>

<ion-content class="ion-padding">
  <div class="inner-content">
    <p
      *ngIf="isPartyBForm && !vessels?.length"
      class="no-vessels-text"
    >
    {{noVesselsText}}
    </p>
    <app-form
      class="create-clause-detail"
      [tunaFormGroup]="pageFormGroup"
      [tunaFormquestions]="formQuestions"
      [submitButtonText]="submitButtonText"
      (formValue)="onSubmit($event)"
    >
    </app-form>
  </div>
  
</ion-content>
