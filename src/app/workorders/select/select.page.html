<app-header></app-header>
<ion-content>
  <div class="content">
    <!-- <ion-label class="title"><strong>Work Orders</strong></ion-label> -->
    <ion-searchbar placeholder="search work orders"></ion-searchbar>
    <ion-item *ngFor="let wo of workOrders">
      <ion-checkbox slot="start" [value]="wo" (ionChange)="selectedWorkOrder($event)" ></ion-checkbox>
      <ion-card>
        <ion-card-content>
          <ion-grid>
            <ion-row>
              <ion-col size="3" style="padding-top: 15%">
                <ion-icon name="expand-outline" size="large"></ion-icon>
              </ion-col>
              <ion-col size="8">
                <ion-card-title>{{wo.name}}</ion-card-title>
                <ion-card-subtitle>Internal Ref: {{wo.internalRef}}</ion-card-subtitle>
                <br>
                <ion-label><strong>App Ref:</strong> {{wo.appRef}}</ion-label> <br>
                <ion-label><strong>Date Created:</strong> {{wo.dateOpened}}</ion-label> <br>
                <ion-label><strong>Status:</strong> {{wo.status}}</ion-label>
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-card-content>
      </ion-card>
    </ion-item>
  </div>
  <ion-fab vertical="bottom" horizontal="start" slot="fixed">
    <ion-button *ngIf="showConfirmBtn()" class="confirm-btn" (click)="onConfirm()">
      Confirm
    </ion-button>
  </ion-fab>
</ion-content>
