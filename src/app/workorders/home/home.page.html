<app-header [pageTitle]="pageTitle">

</app-header>

<ion-content>
  <app-search [searchDataSet]="workOrders" (searchResult)="searchResult($event)"></app-search>

  <ion-card *ngFor="let wo of workOrders" class="card-body">
    <div  class="card-content">
      <div
        class="card-image-section">
        <img src="/assets/icon/workorders.svg" />
      </div>
      <div class="card-section">
        <div style="position: relative;">
          <div class="status-container">
            <div class="status-wrapper">
              <span >status</span>
            </div>
          </div>
        </div>
        <div class="ion-padding ion-margin-vertical">
          <ion-card-title class="blue-text">{{wo.name}}</ion-card-title>
          <ion-card-subtitle>Internal Ref: {{wo.internalRef}}</ion-card-subtitle>
          <br>
          <ion-label><span class="gray-text">App Ref: </span> <span class="blue-text">{{wo.appRef}}</span></ion-label> <br>
          <ion-label><strong>Date Created:</strong> {{wo.dateOpened}}</ion-label> <br>
          <ion-label><strong>Status:</strong> {{wo.status}}</ion-label>
        </div>
      </div>
    </div>
  </ion-card>
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="createWorkOrder()">
      <ion-icon name="add-circle-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
