<app-header [pageTitle]="pageTitle">

</app-header>

<ion-content>
  <app-search [searchDataSet]="workOrders" (searchResult)="searchResult($event)"></app-search>

  <ion-card *ngFor="let wo of workOrders" style="border-radius: 20px;">
    <div style="display: flex; 
    justify-content: space-between;
    align-items: stretch;
    ">
      <div
        style="
        background: #3565FF; 
        width: 80px; 
        padding: 16px; 
        display: flex; 
        justify-content: center; 
        align-items: center;
        height: auto;
        ">
        <img src="/assets/icon/workorders.svg" />
      </div>
      <div style="
      flex: 1; height: auto;
      display: flex; 
      flex-direction: column;
      ">
        <div style="position: relative;">
          <div style="
          background: #74F080; position: absolute; top: 0px; right: 0px;  
          height: 20px; width: 65px;
          overflow: hidden;
          border-bottom-left-radius: 20px;
          ">
            <div style="position: relative; display: flex; align-items: center; justify-content: center;">
              <span style="color: #000000;">status</span>
            </div>
          </div>
        </div>
        <div class="ion-padding ion-margin-vertical">
          <ion-card-title style="color: #191970;">{{wo.name}}</ion-card-title>
          <ion-card-subtitle>Internal Ref: {{wo.internalRef}}</ion-card-subtitle>
          <br>
          <ion-label><span style="color: #A0ABCC;">App Ref: </span> <span style="color: #3565FF;">{{wo.appRef}}</span></ion-label> <br>
          <ion-label><strong>Date Created:</strong> {{wo.dateOpened}}</ion-label> <br>
          <ion-label><strong>Status:</strong> {{wo.status}}</ion-label>
        </div>
      </div>
    </div>
  </ion-card>
