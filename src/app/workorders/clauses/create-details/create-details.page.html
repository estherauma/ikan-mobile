<div class="inner-content">
  <app-header [pageTitle]="pageTitle"> </app-header>
  <app-genericmodal
    [title] = "pageTitle"
  >
    <app-form
      [tunaFormGroup]="pageFormGroup"
      [tunaFormquestions]="formQuestions"
      [submitButtonText]="submitButtonText"
      (formValue)="onSubmit($event)">
    </app-form>
  </app-genericmodal>
</div>
