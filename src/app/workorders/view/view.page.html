<app-header [isBackButton]="true" [pageTitle]="" [isLightBlueBg]="true"></app-header>

<ion-content class="content-skyblue-bg">
  <ion-grid class="ion-margin">
    <ion-row class="ion-justify-content-between ion-align-items-baseline">
      <ion-col>
        <img src="/assets/icon/workorders_blue.svg" width="32" height="48" />
      </ion-col>
      <ion-col>
        <ion-row class="ion-justify-content-end">
          <div>
            <app-button title="Edit"></app-button>
          </div>
        </ion-row>
      </ion-col>
    </ion-row>
    <div class="title">
      <app-title [isBlue]="true" [isBig]="true" [title]="workOrder?.name" ></app-title>
    </div>
    <div>
      <p class="sub-title">Internal reference: {{workOrder.internalRef}}</p>
        <p class="meta-data">App Ref: <span>{{workOrder?.appRef}}</span></p>
        <p class="meta-data">Date Opened: <span>{{workOrder?.createdAt}}</span></p>
        <p class="meta-data">Status: <span>{{workOrder?.status}}</span></p>
    </div>
  </ion-grid>

<div class="workorders-wrapper ion-padding">
  <div class="workorders-container">
    <div class="clause-sub-title">
      <app-title title="clauses" [isSmall]="true" [isBlue]="true"></app-title>
    </div>
    <app-placementoffercard
    *ngFor="let clause of clauses"
    [title]="clause.title"
    [details]="clause.subTitle"
    [isFirst]="getFirstClause().id === clause.id"
    [isLast]="getLastClause().id === clause.id"
    [noMargin]="true"
    [isBlue]="clause.status === 'active'"
    ></app-placementoffercard>
  </div>
  <div class="ion-margin-vertical" [ngClass]="{'action-buttons': !done}">
    <div *ngIf="done" class="done">
      <app-button title="done" size="small"></app-button>
    </div>
    <app-button *ngIf="!done" title="Re-order" size="small"></app-button>
    <app-button (onClick)="addNewClause()" *ngIf="!done" title="Add new clause" size="small" iconName="add-outline"></app-button>
  </div>
</div>
<div class="ion-margin ion-padding">
  <app-button title="Submit Work Order" [disabled]="!onDisabled" (onClick)="onSubWorkOrder()"></app-button>
  <div class="check-section">
    <ion-checkbox (ionChange)="onCheckBoxSelect($event)" slot="start" ></ion-checkbox>
    <ion-label>You need to complete all sections of the Work Order before you can review or send.</ion-label>
  </div>
</div>
</ion-content>
