<app-header [pageTitle]="pageTitle"></app-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-card-title> {{workOrder?.name}} </ion-card-title>
      </ion-col>

      <ion-col size="12">
        <ion-card-subtitle><strong>Internal reference:</strong> {{workOrder.internalRef}}</ion-card-subtitle>
        <ion-card-subtitle>
          <strong>App Ref:</strong> {{workOrder?.appRef}} |
          <strong>Date Opened</strong> {{workOrder?.dateOpened}} | {{workOrder?.status}}
        </ion-card-subtitle>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-card *ngFor="let clause of clauses">
    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col size="3" style="padding-top: 15%">
            <ion-icon name="expand-outline" size="large"></ion-icon>
          </ion-col>
          <ion-col size="8">
            <ion-card-title>{{clause.title}}</ion-card-title>
            <ion-card-subtitle> {{clause.description}} </ion-card-subtitle>

          </ion-col>
          <ion-col size="1" style="text-align: center; padding-top: 15%">
            <ion-icon name="chevron-forward-outline" size="large"></ion-icon>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
  <ion-button (click)="onSubWorkOrder()" expand="block">
    Submit Work Order
  </ion-button>
</ion-content>
