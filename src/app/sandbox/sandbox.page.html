<app-header></app-header>

<ion-content>
  <div class="ion-padding">
    <p>document card</p>
    <app-documentupload imgUrl="/assets/imgs/auth_background.png" type="upload"></app-documentupload>
    <app-documentupload [isTransparent]="true" imgUrl="/assets/imgs/auth_background.png"></app-documentupload>
    <app-documentupload [isTransparent]="true" imgUrl="/assets/imgs/auth_background.png"
      variant="solid"></app-documentupload>
    <app-documentupload type="upload" [isTransparent]="true"></app-documentupload>
  </div>
  <div class="ion-padding">
    <div>
      <p>contract cards</p>
      <app-usercontractcard *ngFor="let contract of contracts" [imgUrl]="contract.imgUrl" [title]="contract.title"
        [contract]="contract.contract" [vessel]="contract.vessel" [dates]="contract.dates" [isLight]="contract.isLight">
      </app-usercontractcard>
    </div>

    <app-maincard imagePosition="left" imageShape="circle" imageUrl="/assets/icon/image_placeholder.svg" title="small"
      text="small line of supporting text" cardTitleSize="small"></app-maincard>
    <app-maincard imagePosition="top" imageUrl="/assets/icon/image_placeholder.svg" title="medium"
      text="medium line of supporting text"></app-maincard>
    <app-maincard title="big" text="big line of supporting text" cardTitleSize="big"></app-maincard>
    <app-maincard imageSize="small" imageUrl="/assets/icon/image_placeholder.svg" title="medium"
      text="small image and medium title"></app-maincard>
    <app-maincard progressBarValue="75" imagePosition="left" imageUrl="/assets/icon/image_placeholder.svg"
      title="medium" text="medium line of supporting text"></app-maincard>
    <p>payments summary cards</p>
    <app-paymentssummarycard *ngFor="let payment of payments" [status]="payment.status" [title]="payment.amount"
      [text]="payment.text">
    </app-paymentssummarycard>
  </div>

  <div>
    <p>app main card</p>
    <app-maincard imagePosition="left" imageShape="circle" imageUrl="/assets/icon/image_placeholder.svg" title="small"
      text="small line of supporting text" cardTitleSize="small"></app-maincard>
    <app-maincard imagePosition="top" imageUrl="/assets/icon/image_placeholder.svg" title="medium"
      text="medium line of supporting text"></app-maincard>
    <app-maincard title="big" text="big line of supporting text" cardTitleSize="big"></app-maincard>
    <app-maincard imageSize="small" imageUrl="/assets/icon/image_placeholder.svg" title="medium"
      text="small image and medium title"></app-maincard>
    <app-maincard progressBarValue="75" imagePosition="left" imageUrl="/assets/icon/image_placeholder.svg"
      title="medium" text="medium line of supporting text"></app-maincard>
  </div>

  <div class="ion-padding">
    <p>placement offer</p>

    <div>
      <app-placementoffercard
      [isFirst]="true"
      ></app-placementoffercard>
      <app-placementoffercard></app-placementoffercard>
      <app-placementoffercard
      [isLast]="true"
      ></app-placementoffercard>
    </div>

    <div>
      <app-placementoffercard
      [isFirst]="true"
      [noMargin]="true"
      ></app-placementoffercard>
      <app-placementoffercard
      [noMargin]="true"></app-placementoffercard>
      <app-placementoffercard
      [isLast]="true"
      [noMargin]="true"
      ></app-placementoffercard>
    </div>

  </div>
</ion-content>
