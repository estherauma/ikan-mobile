<app-header [pageTitle]="pageTitle"></app-header>

<ion-content>
  <ion-grid class="ion-padding">
    <ion-row class="ion-align-items-center">
      <ion-col size="4">
        <ion-thumbnail class="image">
          <ion-icon name="expand-outline" size="large"></ion-icon>
        </ion-thumbnail>
      </ion-col>
      <ion-col>
        <h1>{{pageTitle}}</h1>
        <h5>(150)</h5>
      </ion-col>
    </ion-row>
  </ion-grid>

  <app-search [searchDataSet]="agents" (searchResult)="searchResult($event)"></app-search>

  <!-- TODO: Add filter shared component -->
  <ion-card *ngFor="let agent of agents" class="card-body">
    <div  class="card-content">
      <div
        class="card-image-section">
        <img class="image" src="/assets/icon/ellipse_profile.svg" />
      </div>
      <div class="card-section">
        <div style="position: relative;">
          <div class="status-container">
            <div class="status-wrapper">
              <span >status</span>
            </div>
          </div>
        </div>
        <div class="ion-padding ion-margin-vertical">
          <ion-card-title class="blue-text">{{agent.name}}</ion-card-title>
          <ion-label><span class="gray-text">Contact: {{agent.contact}}</span></ion-label> <br>
        </div>
      </div>
    </div>
  </ion-card>
</ion-content>
