
<ion-content>
  <app-authbgpaper></app-authbgpaper>
  <div class="ion-padding center-content">
    <div>
      <ion-row class="ion-justify-content-center">
        <ion-img class="icon" src="/assets/imgs/logo_svg.svg"></ion-img>
      </ion-row>
    </div>
    <div class="ion-padding-vertical">
      <app-button
        config="ikan-light-outline" 
        [title]="inviteCodeAuth" 
        (click)="toInviteCodeScreen()"
        class="login-method"
      ></app-button>
    </div>
    <app-button
      config="ikan-light-outline" 
      [title]="usernameAuth" 
      (click)="loginWithUsername()"
      class="login-method"
    ></app-button>
    <!-- <a class="ion-padding-vertical" routerLink="/auth/how-to-signup">Create account</a> -->
  </div>
</ion-content>
