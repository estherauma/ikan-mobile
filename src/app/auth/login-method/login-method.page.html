
<ion-content>
  <app-authbgpaper></app-authbgpaper>
  
  <div class="ion-padding wrapper">
    <ion-row class="ion-justify-content-center">
      <ion-img class="logo" src="/assets/imgs/logo_svg.svg"></ion-img>
    </ion-row>
    
    <ion-row class="ion-padding-vertical">
      <ion-col size="12" class="ion-text-center">
        <ion-button
          rounded
          expand="block"
          class="login-button"
          (click)="goToLoginScreen()"
        >
          {{ loginText }}
        </ion-button>
      </ion-col>
      
      <ion-col size="12" class="ion-text-center">
        <ion-button
          rounded
          expand="block"
          class="register-button"
          (click)="goToSignupScreen()"
        >
          {{ registerText }}
        </ion-button>
      </ion-col>

      <ion-col size="12" class="ion-text-center">
        <a
          class="invite-code-link"
          routerLink="/auth/invite-code"
          [replaceUrl]="true"
        >
          {{ inviteCodeAuth }}
        </a>
      </ion-col>
    </ion-row>
  </div>
</ion-content>
