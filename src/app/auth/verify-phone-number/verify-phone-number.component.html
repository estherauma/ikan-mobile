<ion-content>
  <app-authbgpaper></app-authbgpaper>

  <div class="ion-padding content-wrapper">
    <div class="back-icon-wrapper">
      <ion-icon icon="arrow-back-outline" (click)="goBack()"></ion-icon>
    </div>
    <div class="logo-wrapper">
      <ion-img class="icon" src="assets/imgs/logo_svg.svg"></ion-img>
    </div>
    <form
      *ngIf="pageFormGroup"
      [formGroup]="pageFormGroup"
      class="verify-phone-number-form"
    >
      <ion-row>
        <ion-col size="12">
          <h2 class="form-title">
            {{ pageText?.verifyPhoneNumber }}
          </h2>
        </ion-col>
        <ion-col size="12">
          <p class="form-subtitle">
            {{ pageText?.verifyPhoneNumberSubtext }}
          </p>
        </ion-col>
      </ion-row>

          <ion-select

            interface="popover"
            (ionChange)="onCountryCodeChange($event)"

              'selected-code': selectedCode

            [okText]="commonText?.ok"
            [cancelText]="commonText?.cancel"
          >
            <ion-select-option

        </ion-col>

            minlength="6"
            [ngClass]="{
              'has-value': pageFormGroup?.value?.phoneNumber
            }"

        </ion-col>

      <ion-row>
        <ion-col size="12">
          <ion-input
            inputmode="tel"
            placeholder="+1234567890"
            formControlName="phoneNumber"
          ></ion-input>
        </ion-col>
        @if (pageFormGroup?.controls?.phoneNumber?.errors?.pattern) {
          <ion-col size="12">
            <p class="error-text">{{ commonText?.invalidPhoneNumberError }}</p>
          </ion-col>
        }
      </ion-row>
      
      <ion-row class="submit-btn-row">
        <ion-col size="12">
          <ion-button
            class="submit-btn"
            shape="round"
            [disabled]="pageFormGroup.invalid"
            (click)="onSubmit(pageFormGroup.value)"
          >
            {{ submitButtonText }}
          </ion-button>
        </ion-col>
      </ion-row>
    </form>
  </div>
</ion-content>
