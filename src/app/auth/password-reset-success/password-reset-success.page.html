<ion-content class="content-skyblue-bg">
  <div class="ion-padding">
    <div class="logo-container">
      <app-badge imageUrl="/assets/icon/ikan_monogram.svg"></app-badge>
    </div>
    <ion-text>
      <app-title class="title" color="#3565FF" [title]="title"></app-title>
    </ion-text>
    <ion-text>
      <p>{{description}}</p>
    </ion-text>
    <div class="ok-btn">
      <app-button (onClick)="toLogin()" size="small" title="OK"></app-button>
    </div>
  </div>
</ion-content>
