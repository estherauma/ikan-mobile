<ion-content class="content-skyblue-bg">
  <div class="ion-padding">
    <div class="logo-container">
      <app-badge imageUrl="/assets/icon/ikan_monogram.svg"></app-badge>
    </div>
    <ion-text>
      <app-title class="title" [isBlue]="true" [title]="pageText?.title"></app-title>
    </ion-text>
    <ion-text>
      <p>{{pageText?.description}}</p>
    </ion-text>
    <div class="ok-btn">
      <app-button
        (onClick)="toLogin()"
        size="small"
        [title]="commonText?.ok"
      ></app-button>
    </div>
  </div>
</ion-content>
