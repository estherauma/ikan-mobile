<ion-content>
  <app-authbgpaper></app-authbgpaper>

  <div class="ion-padding content-wrapper">
    <div class="back-icon-wrapper">
      <ion-icon icon="arrow-back-outline" (click)="goBack()"></ion-icon>
    </div>
    
    <ion-row class="ion-justify-content-center">
      <ion-img class="logo" src="assets/imgs/logo_svg.svg"></ion-img>
    </ion-row>
    
    <ion-row>
      <ion-col size="12" class="form-col">
        <app-form
          class="login-form"
          [tunaFormGroup]="pageFormGroup"
          [tunaFormquestions]="formQuestions"
          [submitButtonText]="submitButtonText"
          [useCustomSubmitButton]="true"
          [passwordFieldType]="passwordFieldType"
          [passwordEyeIcon]="passwordEyeIcon"
        >
        </app-form>
      </ion-col>

      <ion-col size="12" class="forgot-pw-wrapper">
        <a class="reset-link" routerLink="/auth/request-password-reset">{{ pageText?.forgotPassword || 'Forgot Password?' }}</a>
      </ion-col>
      
      <ion-col size="12" class="btn-wrapper">
        <ion-button
          class="login-btn"
          [ngClass]="{ 'enabled-btn': pageFormGroup.valid, 'disabled-btn': !pageFormGroup.valid }"
          [disabled]="!pageFormGroup.valid"
          (click)="onSubmit()"
        >
          {{ submitButtonText }}
        </ion-button>
      </ion-col>
    </ion-row>
  </div>
</ion-content>
