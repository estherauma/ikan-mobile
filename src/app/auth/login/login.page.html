<app-header [pageTitle]="" [isBackButton]="true" [isMenuButton]="false"></app-header>
<ion-content>
  <app-authbgpaper></app-authbgpaper>

  <div class="ion-padding center-content">
    <div>
      <ion-row class="ion-justify-content-center">
        <ion-img style="height:42.26px; width:175px; margin-bottom: 70px;" src="/assets/imgs/logo_svg.svg"></ion-img>
      </ion-row>
    </div>
    <app-form [tunaFormGroup]="pageFormGroup" [tunaFormquestions]="formQuestions" [submitButtonText]="submitButtonText"
      (formValue)="onSubmit($event)">
    </app-form>
    <a routerLink="/auth/password-reset">Reset password</a>
  </div>
</ion-content>
