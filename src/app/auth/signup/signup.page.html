<ion-content class="content-skyblue-bg">
  <div class="ion-padding">
    <div class="back-icon-wrapper">
      <ion-icon icon="arrow-back-outline" (click)="goBack()"></ion-icon>
    </div>

    <div class="logo-container">
      <app-badge imageUrl="/assets/icon/ikan_monogram.svg"></app-badge>
    </div>
    
    <h1 class="title">{{ title }}</h1>
    <p>{{ description }}</p>
    
    <app-form
      btnConfig="default"
      btnFill="solid"
      [tunaFormGroup]="pageFormGroup"
      [tunaFormquestions]="formQuestions"
      [submitButtonText]="submitButtonText"
      [fieldErrors]="fieldErrors"
      [isSubmitting]="isLoading"
      (formValue)="onSubmit($event)"
    >
    </app-form>
  </div>
</ion-content>
