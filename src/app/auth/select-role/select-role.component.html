<ion-content>
<ion-row>
  <ion-col size="12">
    <!-- TODO: add to prismic -->
    <ion-label text-wrap>Please select a role you would like to login with:</ion-label>
  </ion-col>
  <ion-col size="12">
    <ion-radio-group (ionChange)="changeRole($event)">
      <ion-item *ngFor="let item of selectRoleOptions" fill="clear">
        <h2 class="secondary" text-wrap>{{ item?.label }}</h2>
        <ion-radio slot="end" value="{{ item?.value }}"></ion-radio>
      </ion-item>
    </ion-radio-group>
  </ion-col>
</ion-row>
</ion-content>
