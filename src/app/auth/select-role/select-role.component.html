<!-- TODO: check if from mmodal & not show header -->
<!-- translate text -->
<app-header pageTitle="Change Role"></app-header>
<ion-content>
  <div class="content-wrapper">
    <ion-row>
      <!-- TODO: add to prismic -->
      <ion-label class="title" text-wrap>Please select a role you would like to login with:</ion-label>
    </ion-row>
    <!-- remove value -->
    <ion-radio-group (ionChange)="changeRole($event)">
      <ion-row *ngFor="let item of selectRoleOptions" class="label-row">
        <ion-col size="12">
          <ion-item fill="clear" lines="none">
            <h3 class="label" text-wrap>{{ item?.label }}</h3>
            <ion-radio slot="end" value="{{ item?.value }}"></ion-radio>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-radio-group>
  </div>
</ion-content>
