<ion-content>
  <app-authbgpaper></app-authbgpaper>

  <div class="ion-padding center-content">
    <div>
      <ion-row class="ion-justify-content-center">
        <ion-img class="icon" src="/assets/imgs/logo_svg.svg"></ion-img>
      </ion-row>
    </div>
    <ion-label class="ion-label">{{pageTitle}}</ion-label>
    
    <app-form 
      btnConfig="default" 
      btnFill="solid" 
      [tunaFormGroup]="pageFormGroup" 
      [tunaFormquestions]="formQuestions" 
      [submitButtonText]="submitButtonText"
      (formValue)="onSubmit($event)">
    </app-form>

  </div>
    

</ion-content>
