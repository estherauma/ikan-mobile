<ion-content class="content-skyblue-bg">
  <div class="ion-padding">
    <div class="logo-container">
      <app-badge imageUrl="/assets/icon/ikan_monogram.svg"></app-badge>
    </div>
    <ion-text>
      <app-title class="title" [isBlue]="true" [title]="title"></app-title>
    </ion-text>
    <ion-text>
      <p>{{description}}</p>
    </ion-text>
    <!-- TODO: localise -->
    <a [href]="externalResourceLink" target="_blank">Link to external resource</a> 
    <div class="ok-btn">
      <app-button (onClick)="onCreateLogin()" size="small" title="OK"></app-button>
    </div>
  </div>
</ion-content>
