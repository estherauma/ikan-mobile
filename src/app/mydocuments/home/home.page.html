<app-header [pageTitle]=""></app-header>

<ion-content>
  <div class="toggle-nav-buttons ion-padding">
    <div class="active-btn" (click)="onGoToEssentials()">Essentials</div>
    <div class="inactive-btn" (click)="onGoToFiles()">My Files</div>
  </div>
  <div class="ion-padding-vertical">
    <div class="image-upload ion-margin-horizontal" (click)="onCreateVisa()">
      <ion-thumbnail class="image">
        <ion-img [src]=""></ion-img>
      </ion-thumbnail>
      <div style="display: flex; align-items: center;">
        <ion-icon size="medium" name="add-outline"></ion-icon>
        <ion-text><h5>Add Passport</h5></ion-text>
      </div>
    </div>
    <ion-card>
      <ion-card-content>
        <ion-grid>
          <ion-row class="ion-align-items-center" (click)="onViewDocument('documentUrl')">
            <ion-col size="2">
              <ion-thumbnail>
                <ion-img [src]=""></ion-img>
              </ion-thumbnail>
            </ion-col>
            <ion-col size="9">
              <ion-card-title>Visa</ion-card-title>
              <ion-label>Uploaded xx/xx/xxxx</ion-label>
            </ion-col>
            <ion-col size="1">
              <ion-icon name="checkmark-circle-outline"></ion-icon>
              <ion-icon name="chevron-forward-outline"></ion-icon>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>
    <div class="image-upload ion-margin-horizontal">
      <ion-thumbnail class="image">
        <ion-img [src]=""></ion-img>
      </ion-thumbnail>
      <div style="display: flex; align-items: center;">
        <ion-icon size="medium" name="add-outline"></ion-icon>
        <ion-text><h5>Add Document Name</h5></ion-text>
      </div>
    </div>
    <ion-card>
      <ion-card-content>
        <ion-grid>
          <ion-row class="ion-align-items-center">
            <ion-col size="2">
              <ion-thumbnail>
                <ion-img [src]=""></ion-img>
              </ion-thumbnail>
            </ion-col>
            <ion-col size="9">
              <ion-card-title>Seaman's book</ion-card-title>
              <ion-label>Uploaded xx/xx/xxxx</ion-label>
            </ion-col>
            <ion-col size="1">
              <ion-icon name="checkmark-circle-outline"></ion-icon>
              <ion-icon name="chevron-forward-outline"></ion-icon>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
