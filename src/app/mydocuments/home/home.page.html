<app-header></app-header>

<ion-content>
  <div class="title-container">
    <ion-row class="ion-padding title">
      <ion-col size="12">
        <app-title [isBlue]="true" [title]="pageTitle"></app-title>
      </ion-col>
    </ion-row>
  </div>
  
  <div class="segments-wrapper">
    <div class="segments">
      <ion-segment (ionChange)="onSegmentChange($event)" [value]="activeSegment">
        <ion-segment-button value="essentials">
          <ion-item lines="none">
            <ion-icon item-start name="document"></ion-icon>
            <ion-label>{{ docsCommonText?.essentials }}</ion-label>
        </ion-item>
        </ion-segment-button>
        <ion-segment-button value="myfiles">
          <ion-item lines="none">
            <ion-icon name="folder"></ion-icon>
            <ion-label>{{ docsCommonText?.myFiles }}</ion-label>
          </ion-item>
        </ion-segment-button>
      </ion-segment>
    </div>

    <div class="segment-content">
      <app-essentials
        *ngIf="activeSegment === 'essentials'"
        class="segement-essentials"
      >
      </app-essentials>
      <app-files
        *ngIf="activeSegment === 'myfiles'"
        class="segment-files"
      >
      </app-files>
    </div>
  </div>
</ion-content>
