<div class="image-view-wrapper" [ngClass]="customImageViewClass">
  <ion-icon name="close" (click)="closeImage()"></ion-icon>
  <div class="img-wrapper">
    @if (sharedMethods.isIos) {
      <img [src]="imageFile.fileUrl | safeurl" alt="{{ imageFile.fileName }}" />
    }
    @if (!sharedMethods.isIos) {
      <img [src]="imageFile.fileUrl" alt="{{ imageFile.fileName }}" />
    }
  </div>
  <div class="name-wrapper">
    <p>{{ imageFile.fileName }}</p>
  </div>
</div>
