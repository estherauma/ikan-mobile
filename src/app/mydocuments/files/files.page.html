<div class="content-wrapper">
  <!-- <app-search [searchDataSet]="[]" (searchResult)="searchResult($event)"></app-search> -->
  <ion-row *ngIf="documents.length" class="ion-justify-content-end select-row">
    <p
      class="select"
      (click)="editDocuments()"
    >
      {{ commonText?.select }}
    </p>
  </ion-row>

  <div *ngIf="documents.length > 0" class="documents-wrapper">
    <ion-row>
      <ion-col
        class="ion-padding"
        size="6"
        *ngFor="let doc of documents; let i = index"
        (click)="doc.type === 'image' ? viewImage(doc) : viewFile(doc)"
      >
        <img
          *ngIf="doc.type === 'image' && sharedMethods.isIos"
          [src]="doc.url | safeurl"
          [alt]="doc.name"
        />

        <img
          *ngIf="doc.type === 'image' && !sharedMethods.isIos"
          [src]="doc.url"
          [alt]="doc.name"
        />
        <div *ngIf="doc.type === 'pdf'" class="img doc-icon-wrapper">
          <!-- translate -->
          <img
            src="assets/icon/documents.svg"
            [alt]="commonText?.pdfAltText || 'pdf file icon'"
          />
        </div>
        <p *ngIf="doc.name" class="file-name">{{ doc.name }}</p>
        <p *ngIf="doc.updatedAt || doc.createdAt">{{ doc.updatedAt || doc.createdAt | date:'dd/MM/yyy' }}</p>
        <p *ngIf="doc.size">{{ doc.size }}</p>
        <ion-icon
          *ngIf="isEditing"
          class="ellipse"
          name="ellipse"
          (click)="selectDocument(doc)"
        ></ion-icon>
        <ion-icon
          *ngIf="isEditing && selectedDocuments.includes(doc)"
          class="radio"
          name="radio-button-on"
          (click)="unSelectDocument(doc)"
        ></ion-icon>
      </ion-col>
    </ion-row>
  </div>

  <div class="del-share-btns" *ngIf="isEditing && !!selectedDocuments.length">
    <div>
      <ion-icon name="share-outline" (click)="shareDocs()"></ion-icon>
    </div>
    <div>
      <ion-icon name="trash" (click)="openDelAlert()"></ion-icon>
    </div>
  </div>
</div>
