<div class="content-wrapper">
  <!-- <app-search [searchDataSet]="[]" (searchResult)="searchResult($event)"></app-search> -->
  <ion-row class="add-select-row">
    <ion-col size="8" class="add-col">
      <ion-button (click)="addDocument()">
        <ion-icon slot="icon-only" name="add"></ion-icon>
        <!-- translate -->
        Add Document
      </ion-button>
    </ion-col>
    <ion-col size="4" *ngIf="documents.length" class="ion-justify-content-end select-col">
      <p
        class="select"
        (click)="editDocuments()"
      >
        {{ commonText?.select }}
      </p>
    </ion-col>
  </ion-row>

  <div *ngIf="documents.length > 0" class="documents-wrapper">
    <ion-row>
      <ion-col
        class="ion-padding"
        size="6"
        *ngFor="let doc of documents; let i = index"
        (click)="doc.docType === 'image' ? viewImage(doc) : viewFile(doc)"
      >
        <img
          *ngIf="doc.docType === 'image' && sharedMethods.isIos"
          [src]="doc.fileUrl | safeurl"
          [alt]="doc.fileName"
        />

        <img
          *ngIf="doc.docType === 'image' && !sharedMethods.isIos"
          [src]="doc.fileUrl"
          [alt]="doc.fileName"
        />
        <div *ngIf="doc.docType === 'pdf'" class="img doc-icon-wrapper">
          <!-- translate -->
          <img
            src="assets/icon/documents.svg"
            [alt]="commonText?.pdfAltText || 'pdf file icon'"
          />
        </div>
        <p *ngIf="doc.fileName" class="file-name">{{ doc.fileName }}</p>
        <p *ngIf="doc.updatedAt || doc.createdAt">{{ doc.updatedAt || doc.createdAt | date:'dd/MM/yyy' }}</p>
        <p *ngIf="doc.fileSize">{{ doc.fileSize }}</p>
        <ion-icon
          *ngIf="isEditing"
          class="ellipse"
          name="ellipse"
          (click)="selectDocument(doc)"
        ></ion-icon>
        <ion-icon
          *ngIf="isEditing && selectedDocuments.includes(doc)"
          class="radio"
          name="radio-button-on"
          (click)="unSelectDocument(doc)"
        ></ion-icon>
      </ion-col>
    </ion-row>
  </div>

  <div class="del-share-btns" *ngIf="isEditing && !!selectedDocuments.length">
    <div>
      <ion-icon name="share-outline" (click)="shareDocs()"></ion-icon>
    </div>
    <div>
      <ion-icon name="trash" (click)="openDelAlert()"></ion-icon>
    </div>
  </div>
</div>
