<app-header [pageTitle]=""></app-header>

<ion-content [fullscreen]="true" class="content-skyblue-bg">
  <div class="wrapper">
    <ion-img class="image" [src]="imageUrl"></ion-img>
  </div>
</ion-content>
<div class="bottom-element">
  <div *ngIf="backUrl" (click)="onClose()">
    {{closeText}}
  </div>
  <div>
    <ion-icon name="ellipsis-vertical-outline" size="large"></ion-icon>
  </div>
</div>
