<app-header></app-header>

<ion-content>
  <div *ngFor="let item of notifications" style="margin-left: 10px;">
    <ion-text> <strong>{{item.title}}</strong></ion-text>
    <ion-card *ngFor="let notif of item.content">
      <ion-card-content>
        <ion-grid>
          <ion-row>
            <ion-col size="2">
              <ion-icon name="expand-outline"></ion-icon>
            </ion-col>
            <ion-col size="10">
              <ion-text>
                <ion-grid>
                  <ion-row>
                    <ion-col size="8">
                      <h2>{{notif.title}}</h2>
                    </ion-col>
                    <ion-col size="4">
                      <p>{{notif.daysAgo}}</p>
                    </ion-col>
                  </ion-row>
                </ion-grid>

                <p>{{notif.text}}</p>
              </ion-text>
              <div *ngIf="notif.attachmentType === 'pdf'" style="background: #D9D9D9; padding: 10px 10px 10px 10px">
                <h6>Attachment.pdf</h6>
              </div>

              <audio controls style="width: 90%;" *ngIf="notif.attachmentType === 'audio'">
                <source src="horse.ogg" type="audio/ogg">
                Your browser does not support the audio tag.
              </audio>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
