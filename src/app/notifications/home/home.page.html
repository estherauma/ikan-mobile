<app-header></app-header>

<ion-content>
  <div *ngFor="let item of notifications" style="margin-left: 10px;">
    <ion-text> <strong>{{item.title}}</strong></ion-text>
    <ion-item-sliding *ngFor="let notif of item.content">
      <ion-item>
        <app-notificationcard [notification]="notif"></app-notificationcard>
      </ion-item>
    </ion-item-sliding>
  </div>
</ion-content>
