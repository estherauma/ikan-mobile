<app-header></app-header>

<ion-content class="content-skyblue-bg ion-content-custom-position">
  <app-contentwrapper>
    <div class="ion-padding">
      <div>
        <app-title [isBig]="true" [isBlue]="true" title="{{pageTitle}}"></app-title>
      </div>
      @for (item of notifications; track item) {
        <div class="ion-margin-top">
          @if (item.title !== 'New') {
            <ion-text class="ion-padding-bottom"> <strong>{{item.title}}</strong></ion-text>
          }
          @if (item.title === 'New') {
            <ion-badge class="ion-margin-bottom" slot="start">{{item.title}}</ion-badge>
          }
          <ion-list>
            @for (notif of item.content; track notif) {
              <ion-item-sliding>
                <ion-item lines="none" fill="solid">
                  <app-notificationcard
                    [notification]="notif"
                    titleColor="blue"
                    [status]="notif.status"
                  ></app-notificationcard>
                </ion-item>
                <ion-item-options side="end">
                  <ion-item-option class="ion-item-option-first">
                    <ion-icon name="ellipsis-horizontal-circle"></ion-icon>
                    <p>{{moreText}}</p>
                  </ion-item-option>
                  <ion-item-option class="ion-item-option-second" color="danger">
                    <ion-icon slot="icon-only" name="trash"></ion-icon>
                    <p>Delete</p>
                  </ion-item-option>
                </ion-item-options>
              </ion-item-sliding>
            }
          </ion-list>
        </div>
      }
    </div>
  </app-contentwrapper>
</ion-content>
