<ion-content>
  <!-- Hidden audio element -->
  <audio #audioPlayer [src]="audioUrl" hidden>
  </audio>

  <!-- Disabled for now -->
  <!-- <ion-row class="audio-row">
    @if (audioUrl) {
      <ion-col class="audio-col">
        <ion-icon
          class="audio-icon"
          name="volume-high"
          (click)="playAudio()"
        ></ion-icon>
      </ion-col>
    }
  </ion-row> -->

  <div class="content-wrapper">
    <!-- <div class="icon-wrapper">
      <ion-icon [name]="icon" class="icon"></ion-icon>
    </div> -->
    @if (title) {
      <h1 class="title">{{ title }}</h1>
    }
    <app-rich-text [textContent]="description" class="tutorial-detail-description"></app-rich-text>
    
    <div class="video-wrapper" [ngClass]="{'no-video-wrapper': !videoUrl}">
      @if (videoUrl) {
        <video
          #videoPlayer
          class="video-el"
          [src]="videoUrl + (videoUrl ? '#t=0.001' : '')"
          (play)="isVideoPlaying = true"
          (pause)="isVideoPlaying = false"
          (ended)="isVideoPlaying = false"
          [controls]="isVideoPlaying"
        ></video>
        @if (!isVideoPlaying) {
          <ion-icon name="play" class="play-icon" (click)="playVideo()"></ion-icon>
        }
      }
    </div>
  </div>

  <div class="btn-wrapper">
    <ion-icon
      name="close-outline"
      class="arrow-icon"
      (click)="closeModal()"
    ></ion-icon>
  </div>
</ion-content>
