<ion-content>
  <!-- Hidden audio element -->
  <audio #audioPlayer [src]="audioUrl" hidden>
  </audio>

  <ion-row class="audio-row">
    <ion-col *ngIf="audioUrl" class="audio-col">
      <ion-icon
        class="audio-icon"
        name="volume-high"
        (click)="playAudio(audioUrl)"
      ></ion-icon>
    </ion-col>
  </ion-row>

  <div class="content-wrapper">
    <div class="icon-wrapper">
      <ion-icon [name]="icon" class="icon"></ion-icon>
    </div>
    <h1 *ngIf="title">{{ title }}</h1>
    <ng-container *ngFor="let item of description;">
      <h1 *ngIf="item.heading1" [innerHTML]="item.heading1" class="title" text-wrap></h1>
      <h2 *ngIf="item.heading2" [innerHTML]="item.heading2" class="title" text-wrap></h2>
      <h3 *ngIf="item.heading3" [innerHTML]="item.heading3" class="title" text-wrap></h3>
      <h4 *ngIf="item.heading4" [innerHTML]="item.heading4" class="title" text-wrap text-center></h4>
      <h5 *ngIf="item.heading5" [innerHTML]="item.heading5" class="title" text-wrap></h5>
      <h6 *ngIf="item.heading6" [innerHTML]="item.heading6" class="title" text-wrap></h6>
      <p *ngIf="item.paragraph" [innerHTML]="sharedMethods?.removeNBSP(item.paragraph)" text-wrap></p>
      <img *ngIf="item.image" [src]="item.image" alt="Image">
      <ol type="1" *ngIf="item.orderedList">
        <li *ngFor="let subListItem of item.orderedList" text-wrap>
          <p [innerHTML]="sharedMethods?.removeNBSP(subListItem)" text-wrap></p>
        </li>
      </ol>
      <ul *ngIf="item.unorderedList">
        <li *ngFor="let subListItem of item.unorderedList" [innerHTML]="sharedMethods?.removeNBSP(subListItem)" text-wrap></li>
      </ul>
    </ng-container>
    <div class="video-wrapper">
      <video
        *ngIf="videoUrl"
        [src]="videoUrl"
        controls
        class="video-el"
      ></video>
    </div>
  </div>
</ion-content>
