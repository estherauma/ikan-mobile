<ion-content>
  <!-- Hidden audio element -->
  <audio #audioPlayer [src]="audioUrl" hidden>
  </audio>

  <ion-row class="audio-row">
    @if (audioUrl) {
      <ion-col class="audio-col">
        <ion-icon
          class="audio-icon"
          name="volume-high"
          (click)="playAudio()"
        ></ion-icon>
      </ion-col>
    }
  </ion-row>

  <div class="content-wrapper">
    <div class="icon-wrapper">
      <ion-icon [name]="icon" class="icon"></ion-icon>
    </div>
    @if (title) {
      <h1>{{ title }}</h1>
    }
    <app-rich-text [textContent]="description"></app-rich-text>
    <div class="video-wrapper">
      @if (videoUrl) {
        <video
          [src]="videoUrl"
          controls
          class="video-el"
        ></video>
      }
    </div>
  </div>

  <div class="btn-wrapper">
    <ion-icon
      name="close-outline"
      class="arrow-icon"
      (click)="closeModal()"
    ></ion-icon>
  </div>
</ion-content>
