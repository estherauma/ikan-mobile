<div>
  <ion-label>Enter your unique 16 digit code</ion-label>
  <div class="inputs-wrapper">
    <ion-input #input1 maxlength="4" type="cc-number" [(ngModel)]="inputOne" class="input" (keyup)="onDigitInput($event)"></ion-input>
    <ion-input #input2 maxlength="4" type="cc-number" [(ngModel)]="inputTwo" class="input" (keyup)="onDigitInput($event)"></ion-input>
    <ion-input #input3 maxlength="4" type="cc-number" [(ngModel)]="inputThree" class="input" (keyup)="onDigitInput($event)"></ion-input>
    <ion-input #input4 maxlength="4" type="cc-number" [(ngModel)]="inputFour" class="input" (keyup)="onDigitInput($event)"></ion-input>
  </div>
</div>
