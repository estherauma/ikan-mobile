<ion-card 
(click)="viewDetails(vessel)" 
[ngClass]="{
  'is-no-border-shadow': isNoBorderShadow,
  'transparent-bg': background === 'transparent'
}"
>
  <ion-card-content>
    <div 
    class="vessel-image-container"
    [ngStyle]="{'background': 'url(' + vessel.imgUrl + ') no-repeat 0 0 / cover'}"
     >
    </div>
    
    <ion-grid>
      <ion-row>
        <ion-col size="3">
          <ion-img class="icon" src="/assets/icon/boat_with_blue_bg.svg"></ion-img>
        </ion-col>

        <ion-col size="9">
          <ion-card-title class="title"> {{vessel.name}}</ion-card-title>
          <p class="text-label">{{ commonText?.registrationNumber }}: <span class="text-value">{{vessel.regNo}}</span></p>
          <p class="text-label">{{ commonText?.status }}: <span class="text-value">{{vesselStatus}}</span></p>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-card>
