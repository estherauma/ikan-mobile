<ion-card (click)="viewDetails(vessel)">
  <ion-card-content>
    <div 
    class="vessel-image-container"
    [ngStyle]="{'background': 'url(' + vessel.imgUrl + ') no-repeat 0 0 / cover'}"
     >
    </div>
    
    <ion-grid>
      <ion-row>
        <ion-col size="3">
          <ion-img class="icon" src="/assets/icon/boat_with_blue_bg.svg"></ion-img>
        </ion-col>

        <ion-col size="9">
          <ion-card-title class="title"> {{vessel.name}}</ion-card-title>
          <p class="text-label">Registration No: <span class="text-value">{{vessel.regNo}}</span></p>
          <p class="text-label">Status: <span class="text-value">{{vessel.status}}</span></p>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-card>
