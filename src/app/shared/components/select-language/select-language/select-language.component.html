<div class="content-wrapper">
  <ion-row class="content-row">
    <ion-col size="12"  class="logo-wrapper">
      <ion-row class="ion-justify-content-center">
        <ion-img class="icon" src="assets/imgs/logo_svg.svg"></ion-img>
      </ion-row>
    </ion-col>

    <ion-col size="12" size-md="9" size-lg="7" class="selector-col">
      <ion-item lines="none">
        <ion-select
          interface="action-sheet"
          placeholder="Choose your language"
          (ionChange)="onLanguageSelect($event)"
          [value]="selectedLanguage"
        >
          <ion-select-option *ngFor="let language of availableLanguages" [value]="language?.localeCode">
            {{ language?.label }}
          </ion-select-option>
        </ion-select>
      </ion-item>
    </ion-col>
    
    <ion-col size="12" size-md="9" size-lg="7" class="button-col">
      <ion-button
        fill="solid"
        [disabled]="!isLanguageSelected"
        (click)="onSubmit()"
      >
        {{ 'Submit' }}
      </ion-button>
    </ion-col>
  </ion-row>
</div>
