<ion-button 
  [shape]="shape" 
  [fill]="fill" 
  (click)="onClick ? onButtonClick() :  null" 
  expand="full" 
  [size]="size"
  disabled={{disabled}}
  [class]="customClasses"
  [color]="color"
  disabled="true"
  [type]="type"
>
<ion-icon *ngIf="iconPosition === 'left' && iconName" [name]="iconName"></ion-icon>
<span>{{title}}</span>
<ion-icon *ngIf="iconPosition === 'right' && iconName" [name]="iconName"></ion-icon>
</ion-button>
