<ion-button
  id="app-btn"
  [shape]="shape"
  [fill]="fill"
  (click)="onClick ? onButtonClick() :  null"
  [size]="size"
  [disabled]="disabled"
  [class]="customClasses"
  [color]="color"
  [type]="type"
  >
  @if (iconPosition === 'left' && iconName) {
    <ion-icon
      [name]="iconName"
      class="ion-margin-end"
    ></ion-icon>
  }
  <span>{{title}}</span>
  @if (iconPosition === 'right' && iconName) {
    <ion-icon
      [name]="iconName"
      class="ion-margin-start"
    ></ion-icon>
  }
</ion-button>
