<ion-button 
  [shape]="shape" 
  [fill]="fill" 
  (click)="onClick()" 
  expand="full" 
  [size]="size"
  disabled={{disabled}}
  [class]="customClasses"
  [color]="color"
  disabled="true"
>
<ion-icon *ngIf="iconPosition === 'left'" [name]="iconName"></ion-icon>
{{title}}
<ion-icon *ngIf="iconPosition === 'right'" [name]="iconName"></ion-icon>
</ion-button>
