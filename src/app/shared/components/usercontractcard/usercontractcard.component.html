<ion-card class="card-body">
  <div class="card-content">
    <div class="card-image-section">
      <div>
        <ion-img class="icon" src="/assets/icon/contract.svg"></ion-img>
      </div>
      @if (!hideImage) {
        <div class="avatar" [ngStyle]="{'background': 'url(' + imgUrl + ') no-repeat 0 0 / cover'}"></div>
      }
    </div>
    <div class="card-section" [ngClass]="{'light-bg': isLight}">
      <div class="ion-padding content-wrapper">
        <div class="contents-section-container">
          <ion-card-title class="title blue-dark">{{title}}</ion-card-title>
          <ion-label><ion-text class="gray-text">Contract: </ion-text> <ion-text
        class="blue-text">{{contract}}</ion-text></ion-label> <br>
        <ion-label><ion-text class="gray-text">Vessel: </ion-text> <ion-text
      class="blue-text">{{vessel}}</ion-text></ion-label> <br>
      <ion-label><ion-text class="gray-text">Dates: </ion-text> <ion-text
    class="blue-text">{{dates}}</ion-text></ion-label> <br>
  </div>
</div>
</div>
</div>
</ion-card>
