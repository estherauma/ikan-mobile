<ion-card [ngClass]="{'transparent': isTransparent, 'dotted': variant === 'dotted', 'blue': variant === 'solid'}">
  <ion-card-content>
    <ion-row class="ion-align-items-center">
      @if (imgUrl) {
        <ion-col size="3">
          <div
            class="image-container"
            [ngStyle]="{'background': 'url(' + imgUrl + ') no-repeat 0 0 / cover'}"
          ></div></ion-col>
        }
        @if (iconUrl) {
          <ion-img [src]="iconUrl" ></ion-img>
        }
        @if (type === 'upload') {
          <ion-col size="9">
            <div class="icon-name-container"><ion-text><ion-icon name="add"></ion-icon>{{name}}</ion-text></div>
          </ion-col>
        }
        @if (type === 'display') {
          <ion-col>
            <div>
              <ion-text [ngClass]="{'blue-color': variant === 'solid'}">({{name}})</ion-text><br/>
              <ion-text><small class="date">{{ commonText?.uploaded }} {{uploadedDate}}</small></ion-text>
            </div>
          </ion-col>
        }
      </ion-row>
    </ion-card-content>
  </ion-card>
