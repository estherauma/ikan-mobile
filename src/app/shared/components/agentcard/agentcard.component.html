<ion-card class="card-body">
  <div  class="card-content">
    <div
      class="card-image-section">
      <img class="image" src="/assets/icon/ellipse_profile.svg" />
    </div>
    <div class="card-section">
      <div style="position: relative;">
        <div class="status-container">
          <div class="status-wrapper">
            <span >{{agent.status}}</span>
          </div>
        </div>
      </div>
      <div class="ion-padding ion-margin-vertical">
        <ion-card-title class="blue-text">{{agent.name}}</ion-card-title>
        <ion-label><span class="gray-text">Contact: {{agent.telephone}}</span></ion-label> <br>
      </div>
    </div>
  </div>
</ion-card>
