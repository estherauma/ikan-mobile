<ion-card class="notification-card-body">
  <div  class="notification-card-content">
    <div
      class="ion-padding ion-margin-top">
      <img height="24" width="23" [src]="notification.icon" />
    </div>
    <div class="wo-card-section">
      <div style="position: relative;">
        <div [class]="statusContainer + ' status-container'">
          <div class="status-wrapper">
            <span>status</span>
          </div>
        </div>
      </div>
      <div class="title-section ion-margin-vertical ion-padding-end">
        <ion-card-title class="blue-text">{{notification.title}}</ion-card-title>
        <p>{{notification.text}}</p>
        <audio *ngIf="notification.hasAttachment && notification.attachmentType === 'audio'" controls style="width: 100%;">
          <source src="horse.ogg" type="audio/ogg">
          Your browser does not support the audio tag.
        </audio>
        <div *ngIf="notification.hasAttachment && notification.attachmentType === 'pdf'">
          <app-attachment></app-attachment>
          <p class="link">Click to visit external <a>link</a></p>
        </div>
      </div>
    </div>
  </div>
</ion-card>
