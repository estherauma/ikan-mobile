<ion-card>
  <ion-card-content>
    <ion-img [src]="iconUrl"></ion-img>
    <div class="ion-padding">
      <app-title [isBlue]="true" [title]="title"></app-title>
    </div>
    <h4 class="text-content">{{text}}</h4>
    <p class="status">{{ commonText?.status }}: <span>{{status}}</span> </p>
  </ion-card-content>
</ion-card>
