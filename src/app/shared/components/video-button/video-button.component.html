<div class="video-button-component">
  <div
    class="btn-wrapper"
    [ngClass]="{'no-url': !url}"
    (click)="isPlaying ? closeVideo(): playVideo()"
  >
    @if (!customIcon) {
      <ion-icon
        [name]="isPlaying ? 'close' : iconName"
      [ngStyle]="{
        'background': background,
        'color': color
      }"
      [ngClass]="{
        'no-url': !url
      }"
      ></ion-icon>
    }

    @if (customIcon && !isPlaying) {
      <ion-img
        [src]="customIcon"
      [ngStyle]="{
        'background': background,
        'color': color
      }"
      [ngClass]="{
        'no-url': !url
      }"
      ></ion-img>
    }
    @if (customIcon && isPlaying) {
      <ion-icon
        name="close"
      [ngStyle]="{
        'background': background,
        'color': color
      }"
      [ngClass]="{
        'no-url': !url
      }"
      ></ion-icon>
    }
  </div>

  <!-- View video -->
  @if (showVideo) {
    <div class="video-wrapper">
      <video
        #videoPlayer
        [src]="url + (url ? '#t=0.001' : '')"
        controls
        autoplay
        preload="auto"
        poster="none"
        (ended)="closeVideo()"
      >
        {{ commonText?.browserDoesnotSupportVideoTag }}
      </video>
    </div>
  }
</div>
