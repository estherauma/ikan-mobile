<div class="video-button-component">
  <div (click)="isPlaying ?closeVideo(): playVideo()" class="btn-wrapper" [ngClass]="{'no-url': !url}">
    <ion-icon
      *ngIf="!customIcon"
      [name]="isPlaying ? 'close' : iconName"
      [ngStyle]="{
        'background': background,
        'color': color
      }"
      [ngClass]="{
        'no-url': !url
      }"
    ></ion-icon>
    
    <ion-img
      *ngIf="customIcon && !isPlaying"
      [src]="customIcon"
      [ngStyle]="{
        'background': background,
        'color': color
      }"
      [ngClass]="{
        'no-url': !url
      }"
    ></ion-img>
    <ion-icon
      *ngIf="customIcon && isPlaying"
      name="close"
      [ngStyle]="{
        'background': background,
        'color': color
      }"
      [ngClass]="{
        'no-url': !url
      }"
    ></ion-icon>
  </div>

  <!-- View video -->
  <div class="video-wrapper" *ngIf="showVideo">
    <video #videoPlayer controls autoplay (ended)="closeVideo()">
      <source [src]="url" type="video/mp4" />
      <!-- TODO: add translation -->
      {{ commonText?.browserDoesnotSupportViwTag || 'Your browser does not support the video tag.' }}
    </video>
  </div>
</div>
