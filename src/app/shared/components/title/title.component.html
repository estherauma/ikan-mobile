
<h1 *ngIf="variant === 'generic'" class="title" [ngClass]="{'is-blue': isBlue, 'small': isSmall, 'big': isBig, 'is-lightblue': isLightBlue }"> {{title}} <sub *ngIf="subScript"><small class="sub-script small">{{subScript}}</small></sub> </h1>
