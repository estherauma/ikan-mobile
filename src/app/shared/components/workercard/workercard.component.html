<ion-card class="card-body">
  <ion-row>
    <ion-col size="12" class="status-wrapper">
      <div class="status">
        <span [ngClass]="sharedMethods.getStatusClass(worker?.status)">
          {{ sharedMethods.generateWorkerStatus(commonText, worker?.isActive, worker?.isVerified) }}
        </span>
      </div>
    </ion-col>
  </ion-row>

  <ion-row class="card-content">
    <ion-col size="3" class="img-col">
      <div class="card-image-wrapper">
        <ion-icon
          *ngIf="!worker?.profileImage"
          class="image icon"
          src="assets/icon/ellipse_profile.svg"
        />
        <img
          *ngIf="sharedMethods.isIos && worker?.profileImage"
          class="image img"
          [src]="worker?.profileImage | safeurl"
        />
        <img
          *ngIf="sharedMethods.isAndroid && worker?.profileImage"
          class="image img"
          [src]="worker?.profileImage"
        />
      </div>
    </ion-col>

    <ion-col size="9" class="card-section-wrapper">
      <div class="card-section">
        <div class="ion-padding">
          <ion-card-title class="title-text">{{worker?.firstName}} {{worker?.lastName}}</ion-card-title>
          <ion-label><span class="sub-text">{{ commonText?.telephone }}: {{worker?.telephone || worker?.mobile}}</span></ion-label> <br>
          <ion-label><span class="sub-text">{{ commonText?.country }}: {{worker?.country}}</span></ion-label> <br>
        </div>
      </div>
    </ion-col>
  </ion-row>
</ion-card>
