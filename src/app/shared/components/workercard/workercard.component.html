<ion-card class="card-body">
  <ion-row>
    <ion-col size="12" class="status-wrapper">
      <div class="status">
        <!-- TODO: translate worker statuses -->
        <span [ngClass]="sharedMethods.getStatusClass(worker?.status)">
          {{ sharedMethods.generateWorkerStatus(worker?.isActive, worker?.isVerified) }}
        </span>
      </div>
    </ion-col>
  </ion-row>

  <ion-row class="card-content">
    <ion-col size="3" >
      <div class="card-image-wrapper">
        <img class="image" [src]="worker?.profile_img_url || '/assets/icon/ellipse_profile.svg'" />
      </div>
    </ion-col>

    <ion-col size="9" class="card-section-wrapper">
      <div class="card-section">
        <div class="ion-padding">
          <ion-card-title class="title-text">{{worker?.firstName}} {{worker?.lastName}}</ion-card-title>
          <ion-label><span class="sub-text">{{ commonText?.telephone }}: {{worker?.telephone || worker?.mobile}}</span></ion-label> <br>
          <ion-label><span class="sub-text">{{ commonText?.country }}: {{worker?.country}}</span></ion-label> <br>
        </div>
      </div>
    </ion-col>
  </ion-row>
</ion-card>
