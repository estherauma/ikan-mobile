<form [formGroup]="tunaFormGroup" (ngSubmit)="onSubmit($event)">
  <div *ngFor="let question of tunaFormquestions">

    <div [ngSwitch]="question.questionType">
      <div *ngSwitchCase="'textBox'">
        <ion-item *ngIf="question.displayquestion" lines="none">
          <ion-grid>
            <ion-row>
              <ion-col size="12">
                <ion-label text-wrap> {{question.label}} </ion-label>
              </ion-col>
              <ion-col size="12">
                <ion-input type="text" placeholder="Type here" formControlName="{{question.key}}"></ion-input>
              </ion-col>

            </ion-row>
          </ion-grid>
        </ion-item>
      </div>

      <div *ngSwitchCase="'password'">
        <ion-item *ngIf="question.displayquestion" lines="none">
          <ion-grid>
            <ion-row>
              <ion-col size="12">
                <ion-label text-wrap> {{question.label}} </ion-label>
              </ion-col>
              <ion-col size="12">
                <ion-input type="password" placeholder="Type here" formControlName="{{question.key}}"></ion-input>
              </ion-col>

            </ion-row>
          </ion-grid>
        </ion-item>
      </div>

      <div *ngSwitchCase="'number'">
        <ion-item *ngIf="question.displayquestion" lines="none">
          <ion-grid>
            <ion-row>
              <ion-col size="12">
                <ion-label text-wrap> {{question.label}} </ion-label>
              </ion-col>
              <ion-col size="12">
                <ion-input type="number" placeholder="Type here" formControlName="{{question.key}}"></ion-input>
              </ion-col>

            </ion-row>
          </ion-grid>
        </ion-item>
      </div>

      <div *ngSwitchCase="'select'">
        <ion-item *ngIf="question.displayquestion" lines="none">
          <ion-grid>
            <ion-row>
              <ion-col size="12">
                <ion-label text-wrap> {{question.label}} </ion-label>
              </ion-col>
              <ion-col size="12">
                <ion-select  formControlName="{{question.key }}" textWrap interface="action-sheet" placeholder="Please Select">
                  <ion-select-option text-wrap *ngFor="let opt of question.options" value="{{opt}}">
                    {{opt}}
                  </ion-select-option>
                </ion-select>
              </ion-col>

            </ion-row>
          </ion-grid>
        </ion-item>
      </div>

      <div *ngSwitchCase="'date'">
        <ion-item *ngIf="question.displayquestion" lines="none">
          <ion-grid >
            <ion-row >
              <ion-col size="12">
                <ion-label text-wrap> {{question.label}} </ion-label>
              </ion-col>
              <ion-col size="12">
                <ion-datetime  displayFormat="DDDD MMM D, YYYY" min="2015" max="2060" formControlName="{{question.key}}"
                  value="" preferWheel="true" presentation="date"></ion-datetime>
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-item>
      </div>

      <div *ngSwitchCase="'pdfDocument'">
        <ion-item *ngIf="question.displayquestion" lines="none">
          <ion-grid >
            <ion-row>
              <ion-col size="12">
                <ion-label text-wrap> {{question.label}} </ion-label>
              </ion-col>
            </ion-row>
            <ion-row *ngIf="selectedDocuments[question.key]" class="upload-wrapper">
              <div>
                <ion-icon style="color: red;" (click)="removeDocument(question.key)" name="trash-outline"></ion-icon>
                <p>{{selectedDocuments[question.key].name}}</p>
              </div>
            </ion-row>
            <ion-row *ngIf="!selectedDocuments[question.key]" class="upload-wrapper">
              <div (click)="onUpload(question.key)">
                <ion-icon name="document-text-outline"></ion-icon>
                <p>Upload document</p>
              </div>
            </ion-row>

          </ion-grid>
        </ion-item>
      </div>

      <div *ngSwitchCase="'imageBox'">
        <ion-item *ngIf="question.displayquestion" lines="none">
          <ion-grid >
            <ion-row>
              <ion-col size="12">
                <ion-label text-wrap> {{question.label}} </ion-label>
              </ion-col>
            </ion-row>
            <ion-row *ngIf="selectedImages[question.key]" class="image">
              <div>
                <img [src]="selectedImages[question.key].path" />
                <ion-icon class="trash-icon" (click)="removePicture(question.key)" name="trash-outline"></ion-icon>
                <img>
              </div>
            </ion-row>
            <ion-row *ngIf="!selectedImages[question.key]" class="upload-wrapper">
              <div (click)="takePicture(question.key)">
                <ion-icon name="camera-outline"></ion-icon>
                <p>Upload picture</p>
              </div>
            </ion-row>

          </ion-grid>
        </ion-item>
      </div>

    </div>
  </div>

  <ion-grid class="buttons">
    <ion-col size="5">
      <ion-button expand="block" type="submit" class="submit-button" [disabled]="!tunaFormGroup.valid"> {{submitButtonText | uppercase}} </ion-button>
    </ion-col>
  </ion-grid>
</form>
