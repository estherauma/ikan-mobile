<div
  (click)="goToDoc()"
  class="attachment"
[ngClass]="{
  'white-bg': variant === 'white',
  'gray-bg': variant === 'gray'
}"
  >
  <ion-row>
    <ion-col size="1.5">
      <img class="image" [src]="pdfLink" />
    </ion-col>
    <ion-col size="10.5">
      <ion-card-title
        class="title"
      [ngClass]="{
        'color-blue': titleColor === 'blue'
      }"
      >{{pdfName}}</ion-card-title>
      @if (pdfInfo) {
        <p>{{pdfInfo}}</p>
      }
    </ion-col>
  </ion-row>
</div>
