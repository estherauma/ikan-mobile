<div class="attachment" [ngClass]="{'white-bg': variant === 'white'}">
  <ion-row>
    <ion-col size="1">
      <img class="image" [src]="pdfLink" />
    </ion-col>
    <ion-col size="11">
      <ion-card-title class="title">{{pdfName}}</ion-card-title>
      <p *ngIf="pdfInfo">{{pdfInfo}}</p>
    </ion-col>
  </ion-row>
</div>
