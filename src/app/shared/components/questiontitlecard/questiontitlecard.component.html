<ion-card class="question-card">
  <ion-row>
    <ion-col
      size="3"
      class="icon-container"
      [ngClass]="customCss">
      <ion-icon size="large" [name]="iconName"></ion-icon>
    </ion-col>
    
    <ion-col size="9" class="question-container">
      <ion-text class="blue-text">
        <span>Q. </span>
        Question goes here?
      </ion-text>
    </ion-col>
  </ion-row>
</ion-card>
