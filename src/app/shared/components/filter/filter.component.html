<ion-select
  (ionChange)="onChange($event)"
  [class]="customCss + ' filter-border'"
  [placeholder]="commonText?.all"
  [okText]="commonText?.ok"
  [cancelText]="commonText?.cancel"
  [label]="filterLabel"
  multiple
>
  <ng-container *ngIf="options?.length">
    <ion-select-option
      *ngFor="let option of options"
      [value]="{ filterProperty, value: option.value}"
    >
      {{ option?.title || option?.label}}
    </ion-select-option>
  </ng-container>

  <!-- grouped options -->
  <ng-container *ngIf="groupedOptions?.length">
    <ng-container *ngFor="let group of groupedOptions">
      <ng-container *ngIf="group?.groupOptions?.length">
        <ion-select-option disabled class="option-group-custom">{{ group?.groupLabel }}</ion-select-option>
        <ion-select-option
          *ngFor="let opt of group?.groupOptions"
          [value]="{filterProperty: group?.filterProperty, value: opt.value}"
        >
          {{ opt?.title || opt?.label}}
        </ion-select-option>
      </ng-container>
    </ng-container>
  </ng-container>
</ion-select>
<p *ngIf="noData" class="filter-error">{{ commonText?.noDataMatchingSelectedFilters }}</p>
