<div class="audio-video-buttons-wrapper">
  <app-audio-button
    [url]="audioUrl"
    [iconName]="audioIconName"
    [customIcon]="audioCustomIcon"
    [color]="audioColor"
    [background]="audioBackground"
  ></app-audio-button>
  
  <app-video-button
    [url]="videoUrl"
    [iconName]="videoIconName"
    [customIcon]="videoCustomIcon"
    [color]="videoColor"
    [background]="videoBackground"
  ></app-video-button>
</div>
