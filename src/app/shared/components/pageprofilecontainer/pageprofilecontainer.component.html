<div class="main-container" [ngClass]="{'within-nav':withinNav}">
  <div class="image-container">
    <div>
      <div class="profile-image">
        <ion-row>
          <ion-col size="12" class="img-col">
            <div class="img-wrapper">
              <ion-icon
                *ngIf="!imageUrl"
                class="image icon"
                src="assets/icon/ellipse_profile.svg"
              />
              <img
                *ngIf="sharedMethods.isIos && imageUrl"
                class="image img"
                [src]="imageUrl | safeurl"
              />
              <img
                *ngIf="sharedMethods.isAndroid && imageUrl"
                class="image img"
                [src]="imageUrl"
              />
              <ion-icon
                class="edit-icon"
                name="pencil"
                (click)="changePhoto(worker)"
              ></ion-icon>
            </div>
          </ion-col>
        </ion-row>
      </div>
      <div class="status-container" [ngClass]="sharedMethods.getStatusClass(status)">
        <small>{{status}}</small>
      </div>
    </div>
    <app-title [title]="title" [isLightBlue]="true"></app-title>
    <app-button *ngIf="isResendInviteBtn" [title]="reSendInviteBtnTitle" config="yellow"></app-button>
  </div>
  <app-pagetabnavigator 
    (clickedMenuItem)="onClickedMenu($event)"
    [active]="active"
    [navItems]="navItems"
  ></app-pagetabnavigator>
</div>
