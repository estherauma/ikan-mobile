<div class="main-container" [ngClass]="{'within-nav':withinNav}">
  <div class="image-container">
    <div>
      <div class="profile-image">
        <ion-row>
          <ion-col size="12" class="img-col">
            <div class="img-wrapper">
              @if (!imageUrl) {
                <ion-icon
                  class="image icon"
                  src="assets/icon/ellipse_profile.svg"
                  />
              }
              @if (sharedMethods.isIos && imageUrl) {
                <img
                  class="image img"
                  [src]="imageUrl | safeurl"
                  />
              }
              @if (sharedMethods.isAndroid && imageUrl) {
                <img
                  class="image img"
                  [src]="imageUrl"
                  />
              }
              <ion-icon
                class="edit-icon"
                name="pencil"
                (click)="changePhoto(worker)"
              ></ion-icon>
            </div>
          </ion-col>
        </ion-row>
      </div>
      <div class="status-container" [ngClass]="sharedMethods.getStatusClass(status)">
        <small>{{status}}</small>
      </div>
    </div>
    <app-title [title]="title" [isLightBlue]="true"></app-title>
    @if (isResendInviteBtn) {
      <app-button [title]="reSendInviteBtnTitle" config="yellow"></app-button>
    }
  </div>
  <app-pagetabnavigator
    (clickedMenuItem)="onClickedMenu($event)"
    [active]="active"
    [navItems]="navItems"
  ></app-pagetabnavigator>
</div>
