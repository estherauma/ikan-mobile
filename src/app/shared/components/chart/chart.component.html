<div class="chart" [ngClass]="{'custom-border': chartType === 'bar'}">
  <canvas [height]="chartHeight"  [id]="chartId" >{{ chart }}</canvas>
  @if (centerText || centerIcon) {
    <div
  [ngClass]="{
    'blue': centerValueColor === 'blue',
    'white': centerValueColor === 'white'
  }" 
      class="center-container"
      >
      @if (centerText) {
        <p>{{centerText}}</p>
      }
      @if (centerIcon) {
        <ion-icon [name]="centerIcon"></ion-icon>
      }
    </div>
  }
</div>
