<div class="modal-container">
  <div class="header">
    <div class="title-container">
      <h4 class="title">{{title}}</h4>
    </div>
    @if (isCancel) {
      <ion-img class="cancel-img" (click)="onCanceled()" src="/assets/icon/cross_thin.svg"></ion-img>
    }
  </div>
  @if (textContent) {
    <p class="text-center">{{textContent}}</p>
  }
  <div class="content">
    <ng-content></ng-content>
  </div>
  <div class="modal-buttons-cancel-ok" [ngClass]="{'modal-buttons-confirm': isConfirm}">
    @if (isConfirm || isOk) {
      <div class="button">
        <app-button (onClick)="onOk()" title="ok"></app-button>
      </div>
    }
    @if (isConfirm || isCancel) {
      <div class="button">
        <app-button (onClick)="onCanceled()" title="cancel"></app-button>
      </div>
    }
  </div>
</div>
