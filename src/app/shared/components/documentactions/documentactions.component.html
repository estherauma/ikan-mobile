<div class="ion-padding-vertical">
  <div class="ion-padding-horizontal">
    <ion-list>
      <ion-item class="dotted">
        <ion-button>Take photo</ion-button>
      </ion-item>
      <ion-item lines="none">
        <ion-button>From gallery</ion-button>
      </ion-item>
    </ion-list>
  </div>

  <div class="solid-lg-border"></div>

  <div class="ion-padding-horizontal">
    <ion-list>
      <ion-item class="dotted">
        <div style="width: 100%; display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center;">
            <ion-checkbox (ionChange)="onChangeView('icons')"></ion-checkbox>
            <p class="ion-margin">Icons</p>
          </div>
          <ion-icon size="large" name="color-palette-outline"></ion-icon>
        </div>
      </ion-item>
      <ion-item lines="none">
        <div style="width: 100%; display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center;">
            <ion-checkbox (ionChange)="onChangeView('list')"></ion-checkbox>
            <p class="ion-margin">List</p>
          </div>
          <ion-icon size="large" name="list-outline"></ion-icon>
        </div>
      </ion-item>
    </ion-list>
  </div>

  <div class="solid-lg-border"></div>
  <div class="ion-padding-horizontal">
    <ion-list>
      <ion-item *ngFor="let list of settingListThree" >
        <div style="display: flex; align-items: center;">
          <ion-checkbox></ion-checkbox>
          <p class="ion-margin">{{list.name}}</p>
        </div>
      </ion-item>
    </ion-list>
  </div>
</div>
