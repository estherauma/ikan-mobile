<ion-header>
  <ion-toolbar class="header-toolbar ion-no-border" [ngClass]="{'light-blue': isLightBlueBg}" color="transparent" no-border>
    <div class="header-content-container">
      <div class="section-one">
        <ion-back-button *ngIf="isBackButton" defaultHref="" text="" icon="arrow-back-outline">
        </ion-back-button>
        <ion-title>{{pageTitle}}</ion-title>
      </div>
      <div class="section-two">
        <ion-menu-button  *ngIf="isMenuButton">
          <img src='/assets/icon/menu-icon.svg'>
        </ion-menu-button>
      </div>
    </div>
  </ion-toolbar>
</ion-header>
