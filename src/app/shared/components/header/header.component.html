<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button *ngIf="isBackButton" defaultHref="" color="primary" text="" icon="arrow-back-outline"></ion-back-button>
      <ion-menu-button *ngIf="isMenuButton"></ion-menu-button>
    </ion-buttons>
    <ion-title>{{pageTitle}}</ion-title>
  </ion-toolbar>
</ion-header>
