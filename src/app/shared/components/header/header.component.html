<ion-header class="ion-no-border">
  <ion-toolbar
    class="header-toolbar ion-no-border sky-blue-bg"
    [ngClass]="{'light-blue': isLightBlueBg}"
    color="transparent"
    no-border
    mode="ios"
  >
    <ion-row>
      <ion-col size="3.5" class="back-col" [ngClass]="{'no-back-btn': !showBackButton}">
        <ion-back-button
          *ngIf="showBackButton"
          [text]="commonText?.back"
          [defaultHref]="defaultHref"
          icon="arrow-back-outline"
        >
        </ion-back-button>
      </ion-col>
      <ion-col size="8.5" class="icons-col" [ngClass]="{'no-back-btn': !showBackButton}">
        <div *ngIf="showGetHelp" class="get-help-wrapper" (click)="goToHelp()">
          <ion-icon  src="assets/icon/custom_help.svg" class="get-help-icon"></ion-icon>
          <!-- translate -->
          <ion-label>{{ commonText?.help || 'Help' }}</ion-label>
        </div>
        <div *ngIf="showMenuButton" class="menu-wrapper" (click)="openMenu()">
          <ion-icon name="menu-outline" class="menu-icon"></ion-icon>
          <ion-label>{{ commonText?.menu || 'Menu' }}</ion-label>
        </div>
      </ion-col>
    </ion-row>
  </ion-toolbar>
</ion-header>
