<div class="welcome-section">
  <ion-row>
    <ion-col size="3.5">
      <div class="img-wrapper">
        <ion-icon
          *ngIf="!profileImageUrl"
          class="user-icon"
          name="person-circle-outline"
          (click)="onIconClick()"
        >
        </ion-icon>
        <img
          *ngIf="sharedMethods.isIos && profileImageUrl"
          class="user-profile-pic"
          [src]="profileImageUrl | safeurl"
          (click)="onIconClick()"
        />
        <img
          *ngIf="sharedMethods.isAndroid && profileImageUrl"
          class="user-profile-pic"
          [src]="profileImageUrl"
          (click)="onIconClick()"
        />
      </div>
    </ion-col>
    <ion-col size="6.5" class="greeting-col">
      <div>
        <h1> {{ name }} </h1>
        <p> {{ greeting }} </p>
      </div>
    </ion-col>
    <ion-col size="2" class="notification-col">
      <ion-icon class="notification-icon" name="notifications"></ion-icon>
    </ion-col>
  </ion-row>
</div>
