<swiper [slidesPerView]="1" [spaceBetween]="10" [navigation]="true" [pagination]="{ clickable: true }" #intro>
  <ng-template class="slide-content" *ngFor="let slide of slides, let i = index" swiperSlide>
    <div class="back-skip-btns">
      <button *ngIf="i !== 0" class="back" (click)="onBack()">
        <ion-icon size="large"  name="arrow-back-outline"></ion-icon>
        <ion-label>Back</ion-label>
      </button>
      <button *ngIf="i !== 3" class="skip" (click)="onSkip()">
        <ion-label>Skip</ion-label>
        <img src='/assets/icon/forward_arrow.svg'/>
      </button>
    </div>
    <div class="bottom-section">
      <ion-text>
        <app-title class="title" [title]="slide.title"></app-title>
      </ion-text>
      <ion-text>
        <p class="description">{{slide.text}}</p>
      </ion-text>
      <div class="next-finish-btns">
        <app-button *ngIf="i !== 3" config="ikan-light-outline" title="Next" (click)="onNext()"></app-button>
        <app-button *ngIf="i === 3" config="ikan-light-outline" title="Finished" (click)="onFinished()"></app-button>
      </div>
    </div>
  </ng-template>
</swiper>
