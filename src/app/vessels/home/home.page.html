<app-header [pageTitle]="" [isLightBlueBg]="true"></app-header>

<ion-content class="content-skyblue-bg ion-content-custom-position">
  <app-contentwrapper>

  <div>
    <ion-grid>
      <ion-row class="ion-justify-content-between ion-align-items-baseline">
        <ion-col>
          <img src="/assets/icon/workorders_blue.svg" width="20" height="40" />
        </ion-col>
        <ion-col>
          <ion-row class="ion-justify-content-end">
            <div>
              <app-button (onClick)="createVessel()" iconName="add-outline" title="New Vessel"></app-button>
            </div>
          </ion-row>
        </ion-col>
      </ion-row>
      <ion-row class="ion-padding-bottom title">
        <app-title [isBlue]="true" [title]="pageTitle"></app-title>
      </ion-row>
    </ion-grid>

    <!-- search and filters -->
    <div class="ion-margin-top">
      <app-search [searchDataSet]="vessels" (searchResult)="searchResult($event)"></app-search>
      <ion-grid>
        <ion-row>
          <ion-text class="filter-title">Filter</ion-text>
        </ion-row>
        <ion-row>
          <ion-col>
            <app-filter type="deep-blue-90" filterProperty="status" [options]="filterOptions"
              [filterDataSet]="vessels" (filterResult)="filterResult($event)"></app-filter>
          </ion-col>

          <ion-col>
            <app-filter type="deep-blue-90" filterProperty="status" [options]="filterOptions"
              [filterDataSet]="vessels" (filterResult)="filterResult($event)"></app-filter>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>
  </div>

  <div *ngFor="let vessel of vessels">
    <app-vesselownercard [vessel]="vessel"></app-vesselownercard>
  </div>

  </app-contentwrapper>
</ion-content>
