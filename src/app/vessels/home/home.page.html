<app-header [pageTitle]=""></app-header>

<ion-content>

  <div *ngFor="let vessel of vessels">
    <app-vesselownercard [vessel]="vessel"></app-vesselownercard>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="createVessel()">
      <ion-icon name="add-circle-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
