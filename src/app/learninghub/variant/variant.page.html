<app-header [pageTitle]="" [isBackButton]="true"></app-header>

<ion-content>
  <div>
    <div 
    class="image-section" 
    [ngStyle]="{'background': 'linear-gradient( rgba(53, 101, 255, 0.6) 100%, rgba(53, 101, 255, 0.6)100%),url(' + imgUrl +')'}"
    >
    <!-- <ion-slides pager="true">
      <ion-slide>
        <app-title title="Sebelum kamu pergi" [isBig]="true" [isLightBlue]="true"></app-title>
      </ion-slide>
      <ion-slide>
        <app-title title="kamu pergi 2" [isBig]="true" [isLightBlue]="true"></app-title>
      </ion-slide>
    </ion-slides> -->
    </div>
    <div class="audio-section">
      <div>
        <app-audio-player 
        variant="white-bg" 
        size="thin"
        ></app-audio-player>
      </div>
    </div>
    <div class="content-section" 
    >
    <div *ngFor="let lh of learningHub">
      <app-maincard
      [imageUrl]="lh.image"
      imageShape="circle"
      [title]="lh.name"
      [text]="lh.description"
      (click)="viewDetials(lh)"
      ></app-maincard>
    </div>
    </div>
  </div>
