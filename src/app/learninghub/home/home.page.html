<app-header [pageTitle]=""></app-header>

<ion-content class="content-skyblue-bg ion-content-custom-position">
  <app-contentwrapper>
    <div class="ion-margin-start">
      <app-title [isBig]="true" [isBlue]="true" [title]="title"></app-title>
    </div>
    <div>
      <app-maincard
        *ngFor="let chapter of learningHubChapters"
        [title]="chapter?.title"
        [text]="chapter?.text"
        [progressBarValue]="chapter?.progressBarValue"
        [progressBarType]="chapter?.progressBarType"
        [progressText]="chapter?.progressBarText"
        [imageUrl]="chapter?.imageUrl"
        imageSize="big"
        (click)="onClick(chapter)"
      ></app-maincard>
    </div>
  </app-contentwrapper>
</ion-content>
