<app-header [pageTitle]=""></app-header>

<ion-content class="content-skyblue-bg">
  <app-contentwrapper>
    <div class="ion-margin-start">
      <app-title [isBig]="true" [isBlue]="true" [title]="title"></app-title>
    </div>
    <div>
      <app-maincard
      (click)="onClick()"
      *ngFor="let lh of lhs"
      [title]="lh.title"
      [text]="lh.text"
      [progressBarValue]="lh.progressBarValue"
      [progressBarType]="lh.progressBarType"
      [progressText]="lh.progressBarText"
      [imageUrl]="lh.imageUrl"
      imageSize="big"
      ></app-maincard>
    </div>
  </app-contentwrapper>
</ion-content>
