<app-header [pageTitle]="" [isBackButton]="true"></app-header>

<ion-content>
  <div>
    <div
      class="image-section" 
      [ngStyle]="{'background': 'linear-gradient( rgba(53, 101, 255, 0.6) 100%, rgba(53, 101, 255, 0.6)100%),url(' + bgImgUrl +') no-repeat fixed center / cover'}"
    >
      <app-title [title]="pageContent?.pageTitle" [isBig]="true" [isLightBlue]="true"></app-title>
      <!-- TODO: migrate ion-slides to swiperjs -->
      <!-- <ion-slides pager="true">
        <ion-slide>
          <app-title title="Sebelum kamu pergi" [isBig]="true" [isLightBlue]="true"></app-title>
        </ion-slide>
        <ion-slide>
          <app-title title="kamu pergi 2" [isBig]="true" [isLightBlue]="true"></app-title>
        </ion-slide>
      </ion-slides> -->
    </div>
    <div class="audio-section">
      <div>
        <app-audio-player
          variant="gray-bg" 
          size="thin"
          [audioSrc]="pageContent?.pageTitleAudio?.mediaData?.url || ''"
        ></app-audio-player>
      </div>
    </div>
    <div class="content-section">
      <div *ngFor="let subChapter of learningHubSubChapters">
        <app-maincard
          [imageUrl]="subChapter?.icon"
          [title]="subChapter?.name"
          [text]="subChapter?.description"
          (click)="viewDetails(subChapter)"
        ></app-maincard>
      </div>
    </div>
  </div>
</ion-content>
