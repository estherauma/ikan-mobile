<app-header [pageTitle]="" [isBackButton]="true"></app-header>
<ion-content>
  <div class="content-wrapper">
    <div
      class="image-section" 
      [ngStyle]="{'background': 'url(' + imgUrl +') no-repeat fixed center / cover'}"
    >
    <app-title [title]="allPageContent?.pageTitle" [isBig]="true" [isLightBlue]="true"></app-title>
    </div>
    <!-- <div class="audio-section">
      <div>
        <app-audio-player
          variant="gray-bg" 
          size="thin"
          [audioSrc]="allPageContent?.pageTitleAudio?.mediaData?.url || ''"
        ></app-audio-player>
      </div>
    </div> -->
    <div class="content-section">
      <div *ngFor="let section of pageContent">
        <!-- text area type -->
        <shared-text-area
          *ngIf="section?.type === 'text_area'"
          [data]="section"
          styles="textarea"
        ></shared-text-area>
        
        <!-- question type -->
        <div
          *ngIf="isWorker && section?.type === 'questions' && section?.displayquestion"
          class="qtn-wrapper"
          (click)="viewQuestion(section)"
        >
          <ion-row>
            <ion-col
              size="3"
              class="icon-col"
              [ngClass]="{
                'pending': section?.status === 'pending',
                'completed': section?.status === 'completed' ||
                  section?.status === 'answeredYes' ||
                  section?.status === 'answeredNo' ||
                  section?.status === 'answeredMaybe',
              }"
            >
              <ion-icon [name]="section.icon"></ion-icon>
            </ion-col>
            <ion-col size="9" class="qtn-col">
              <p>
                <span class="q">Q.</span>
                <span [innerHtml]="section?.question"></span>
              </p>
            </ion-col>
          </ion-row>
        </div>
    
        <!-- audio type -->
        <app-audio-player
          *ngIf="section?.type === 'audio'"
          [title]="section?.title || ''"
          [audioSrc]="section?.mediaData?.url || ''"
          variant="white-bg-title" 
        ></app-audio-player>
    
        <!-- case study link -->
        <shared-case-study
          *ngIf="section?.type === 'case_study'"
          [data]="section"
          [icons]="caseStudyInputs?.icons"
          [styles]="caseStudyInputs?.styles || ''"
          (onCaseStudyClick)="handleCaseStudyClick(section)"
        >
        </shared-case-study>
    
        <!-- warning box type -->
        <shared-warning-box
          *ngIf="section?.type === 'warning_box'"
          [data]="section"
          defaultIcon="assets/icon/warning-2.svg"
          styles="warning-box"
        >
        </shared-warning-box>
        
        <!-- image type -->
        <shared-image
          *ngIf="section?.type === 'image'"
          [data]="section"
        >
        </shared-image>
        
        <!-- video type-->
         <shared-video
          *ngIf="section?.type === 'video'"
          [data]="section"
          [networkStatus]="networkStatus"
          defaultThumbnail="assets/icon/default-thumbnail.jpg"
          playIcon="assets/icon/play.svg"
          (onPlay)="onPlay($event)"
        >
        </shared-video>
      </div>
    </div>
  </div>
  <div
    *ngIf="upNextContent"
    class="up-next-section"
    (click)="goToNextChapter()"
  >
  <ion-label text-wrap>{{ contentService?.commonText?.upNext }}...</ion-label>
    <app-maincard
      class="upnext"
      [imageUrl]="upNextContent?.icon"
      [title]="upNextContent?.name"
      [text]="upNextContent?.description"
      (click)="goToNextChapter()"
    >
    </app-maincard>
  </div>
</ion-content>
