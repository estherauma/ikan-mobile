<app-header [pageTitle]=""></app-header>
<ion-content>
  <div class="content-wrapper">
    <!-- TODO: add page audio & video to prismic & aggregation -->
    <div class="audio-video-section">
      <app-video-button
        [url]="allPageData?.pageVideo?.url"
        background="var(--ikan_yellow_100)"
      ></app-video-button>
      <app-audio-button
        [url]="allPageData?.pageAudio?.url"
        background="var(--ikan_yellow_100)"
      ></app-audio-button>
    </div>

    <div
      class="title-section" 
      [ngStyle]="{'background': 'url(' + imgUrl +') no-repeat fixed center / cover'}"
    >
      <h1>{{ allPageData?.pageTitle }}</h1>
    </div>

    <div class="content-section">
      <div *ngFor="let section of pageContent">
        <!-- text area type -->
        <shared-text-area
          *ngIf="section?.type === 'text_area'"
          [data]="section"
          styles="textarea"
          [theme]="section?.identifier === 'note_or_tip' ? 'note-or-tip' : ''"
        ></shared-text-area>
        
        <!-- question type -->
        <!-- Commented out for now -->
        <!-- Implementation changed and we are displaying qtuestions on a separate page (quiz page) -->
        <!-- <div
          *ngIf="isWorker && section?.type === 'questions' && section?.displayquestion"
          class="qtn-wrapper"
          (click)="viewQuestion(section)"
        >
          <ion-row>
            <ion-col
              size="3"
              class="icon-col"
              [ngClass]="{
                'pending': section?.status === 'pending',
                'completed': section?.status === 'completed' ||
                  section?.status === 'answeredYes' ||
                  section?.status === 'answeredNo' ||
                  section?.status === 'answeredMaybe',
              }"
            >
              <ion-icon [name]="section.icon"></ion-icon>
            </ion-col>
            <ion-col size="9" class="qtn-col">
              <p>
                <span class="q">Q.</span>
                <span [innerHtml]="section?.question"></span>
              </p>
            </ion-col>
          </ion-row>
        </div> -->
    
        <!-- audio type -->
        <app-audio-player
          *ngIf="section?.type === 'audio'"
          [title]="section?.title || ''"
          [audioSrc]="section?.mediaData?.url || ''"
          variant="white-bg-title" 
        ></app-audio-player>
    
        <!-- case study link -->
        <shared-case-study
          *ngIf="section?.type === 'case_study'"
          [data]="section"
          [icons]="caseStudyInputs?.icons"
          [styles]="caseStudyInputs?.styles || ''"
          (onCaseStudyClick)="handleCaseStudyClick(section)"
        >
        </shared-case-study>
    
        <!-- warning box type -->
        <shared-warning-box
          *ngIf="section?.type === 'warning_box'"
          [data]="section"
          defaultIcon="assets/icon/warning-2.svg"
          styles="warning-box"
        >
        </shared-warning-box>
        
        <!-- image type -->
        <shared-image
          *ngIf="section?.type === 'image'"
          [data]="section"
        >
        </shared-image>
        
        <!-- video type-->
         <shared-video
          *ngIf="section?.type === 'video'"
          [data]="section"
          [networkStatus]="networkStatus"
          defaultThumbnail="assets/icon/default-thumbnail.jpg"
          playIcon="assets/icon/play.svg"
          (onPlay)="onPlay($event)"
        >
        </shared-video>
      </div>
    </div>
  </div>
  <div
    *ngIf="upNextContent"
    class="up-next-section"
    (click)="goToNextChapter()"
  >
    <ion-label text-wrap>{{ contentService?.commonText?.upNext }}...</ion-label>
    <ion-row (click)="goToNextChapter()">
      <ion-col size="3">
        <div class="icon-wrapper">
          <ion-img [src]="upNextContent?.icon"></ion-img>
        </div>
      </ion-col>
      <ion-col size="9">
        <h4>{{ upNextContent?.name }}</h4>
        <ion-text class="description">{{ upNextContent?.description.length > 45 ? upNextContent?.description.slice(0, 45) + '...' : upNextContent?.description }}</ion-text>
      </ion-col>
    </ion-row>
  </div>
</ion-content>
