<app-header [pageTitle]="" [isBackButton]="true"></app-header>
<ion-content>
  <div *ngFor="let section of pageContent">
    <shared-text-area
      *ngIf="section?.type === 'text_area'"
      [data]="section"
      [styles]="'textareaStyles'"
    ></shared-text-area>
    
    <app-questiontitlecard *ngIf="section?.type === 'question'"></app-questiontitlecard>

    <app-audio-player
      *ngIf="section?.type === 'audio'"
      [title]="section?.title || ''"
      [audioSrc]="section?.mediaData?.url || ''"
      variant="gray-bg" 
    ></app-audio-player>

    <shared-case-study
      *ngIf="section?.type === 'case_study'"
      [data]="section"
      [icons]="caseStudyInputs?.icons"
      [styles]="caseStudyInputs?.styles || ''"
      (onCaseStudyClick)="handleCaseStudyClick()"
    >
    </shared-case-study>

    <shared-warning-box
      *ngIf="section?.type === 'warning_box'"
      [data]="section"
    >
    </shared-warning-box>
    
    <shared-image
      *ngIf="section?.type === 'image'"
      [data]="section"
    >
    </shared-image>
  </div>
</ion-content>
