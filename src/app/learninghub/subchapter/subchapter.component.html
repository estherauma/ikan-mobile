<app-header [pageTitle]="" [isBackButton]="true"></app-header>
<ion-content>
  <div
    class="image-section" 
    [ngStyle]="{'background': 'linear-gradient( rgba(53, 101, 255, 0.6) 100%, rgba(53, 101, 255, 0.6)100%),url(' + imgUrl +')'}"
  >
  <app-title [title]="subChapterContent?.pageTitle" [isBig]="true" [isLightBlue]="true"></app-title>
  </div>
  <div class="audio-section">
    <div>
      <app-audio-player
        variant="gray-bg" 
        size="thin"
        [audioSrc]="subChapterContent?.pageTitleAudio?.mediaData?.url || ''"
      ></app-audio-player>
    </div>
  </div>
  <div *ngFor="let section of pageContent">
    <shared-text-area
      *ngIf="section?.type === 'text_area'"
      [data]="section"
      [styles]="'textareaStyles'"
    ></shared-text-area>
    
    <app-questiontitlecard *ngIf="section?.type === 'question'"></app-questiontitlecard>

    <app-audio-player
      *ngIf="section?.type === 'audio'"
      [title]="section?.title || ''"
      [audioSrc]="section?.mediaData?.url || ''"
      variant="gray-bg" 
    ></app-audio-player>

    <shared-case-study
      *ngIf="section?.type === 'case_study'"
      [data]="section"
      [icons]="caseStudyInputs?.icons"
      [styles]="caseStudyInputs?.styles || ''"
      (onCaseStudyClick)="handleCaseStudyClick()"
    >
    </shared-case-study>

    <shared-warning-box
      *ngIf="section?.type === 'warning_box'"
      [data]="section"
    >
    </shared-warning-box>
    
    <shared-image
      *ngIf="section?.type === 'image'"
      [data]="section"
    >
    </shared-image>
  </div>
  <div
    *ngIf="upNextContent"
    class="up-next-section"
    (click)="goToNextChapter()"
  >
    <ion-label>{{ contentService?.commonText?.upNext }}...</ion-label>
    <app-maincard
      imageShape="circle"
      [imageUrl]="upNextContent?.icon"
      [title]="upNextContent?.name"
      [text]="upNextContent?.description"
      (click)="goToNextChapter()"
      ></app-maincard>
  </div>
</ion-content>
