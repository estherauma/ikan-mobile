<app-header [pageTitle]="">
</app-header>

<ion-content>
  <app-dashboardelcomesection message="Welcome back. See notifications for latest updates."
    name="Tony" link=""></app-dashboardelcomesection>
  <div>
    <ion-card>
      <ion-card-content>
        <ion-card-title>{{performanceData.title}}</ion-card-title>
        <ion-grid>
          <ion-row class="ion-align-items-center">
            <ion-col size="4">
              <app-chart chartType="doughnut" [chartDatasets]="performanceData.datasets"></app-chart>
            </ion-col>
            <ion-col size="8">
              <ion-text>
                <h5>41%: Statistics</h5>
              </ion-text>
              <br />
              <ion-text>
                <p>
                  <ion-icon name="square"></ion-icon> 77%: Statistic 1
                </p>
              </ion-text>
              <ion-text>
                <p>
                  <ion-icon name="square"></ion-icon> 20%: Statistic 2
                </p>
              </ion-text>
              <ion-text>
                <p>
                  <ion-icon name="square"></ion-icon> 3%: Statistic 3
                </p>
              </ion-text>
              <br />
              <ion-text class="ion-center"><a routerLink="/feedbackdashboard/home">Feedback Dashboard</a></ion-text>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>
  </div>
  <div style="background-color: #F5F5F5;" class="ion-padding-top">
    <ion-card *ngFor="let dashboardStat of dashboardStats">
      <ion-card-content>
        <ion-card-title>{{dashboardStat.title}}</ion-card-title>
        <ion-grid>
          <ion-row class="ion-align-items-center">
            <ion-col size="4">
              <app-chart chartType="doughnut" [chartDatasets]="performanceData.datasets"></app-chart>
            </ion-col>
            <ion-col size="8">
              <ion-text>
                <h5>41%: Statistics</h5>
              </ion-text>
              <br />
              <ion-text>
                <p>
                  <ion-icon name="square"></ion-icon> 77%: Statistic 1
                </p>
              </ion-text>
              <ion-text>
                <p>
                  <ion-icon name="square"></ion-icon> 20%: Statistic 2
                </p>
              </ion-text>
              <ion-text>
                <p>
                  <ion-icon name="square"></ion-icon> 3%: Statistic 3
                </p>
              </ion-text>
              <br />
              <ion-text class="ion-center"><a routerLink="/feedbackdashboard/home">Feedback Dashboard</a></ion-text>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>
  </div>

</ion-content>
