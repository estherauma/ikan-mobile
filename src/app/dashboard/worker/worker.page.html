<app-header [pageTitle]="">
</app-header>

<ion-content>
    <div class="user-notification">
      <div class="user-section">
        <ion-icon class="user-icon" name="person-circle-outline"></ion-icon>
        <div>
          <ion-text><h1>Hi Budi</h1></ion-text>
          <ion-text><p>Welcome back!</p></ion-text>
        </div>
      </div>
      <ion-icon class="notification-icon" name="notifications-outline"></ion-icon>
    </div>
    <div class="ion-padding">
      <div>
        <ion-card>
          <ion-card-content>
            <ion-grid>
              <ion-row>
                <ion-col size="3">
                  <ion-thumbnail>
                    <ion-img></ion-img>
                  </ion-thumbnail>
                </ion-col>
                <ion-col size="9">
                  <ion-card-title>Knowlede base</ion-card-title>
                  <ion-card-subtitle>Sub text goes here.</ion-card-subtitle>
                </ion-col>
              </ion-row>
            </ion-grid>
            <ion-grid>
              <ion-row>
                <ion-col size="12" style="padding: 64px;">
  
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-card-content>
        </ion-card>
      </div>
      <div>
        <ion-card *ngFor="let sList of sLists">
          <ion-card-content>
            <ion-grid>
              <ion-row>
                <ion-col size="3">
                  <ion-thumbnail>
                    <ion-img></ion-img>
                  </ion-thumbnail>
                </ion-col>
                <ion-col size="9">
                  <ion-card-title>{{sList.title}}</ion-card-title>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-card-content>
        </ion-card>
      </div>
    </div>
</ion-content>
