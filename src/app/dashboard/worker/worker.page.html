<app-header
  [isBackButton]="false"
>
</app-header>

<ion-content>
  <div class="content-container">
    <app-dashboardelcomesection 
      [greeting]="commonText?.fdbkWelcomeText"
      [name]="name"
      (onProfileClick)="goToWorkerProfile()"
    >
    </app-dashboardelcomesection>

    <div class="page-content">
      <div *ngIf="showTriggerButton" class="notif-btn-wrapper">
        <ion-button class="notif-btn" (click)="triggerNotifications()">Trigger Notifications</ion-button>
      </div>
      <div class="ion-padding cards-wrapper">
        <div>
          <ion-card
            routerLink="/learninghub"
            class="hub-content">
            <ion-card-content>
              <ion-grid>
                <ion-row>
                  <ion-col size="12">
                    <ion-card-title class="card-title">{{commonText?.learningHub}}</ion-card-title>
                    <!-- <ion-card-subtitle>Sub text goes here.</ion-card-subtitle> -->
                  </ion-col>
                </ion-row>
              </ion-grid>
            </ion-card-content>
          </ion-card>
        </div>
        <div>
          <ion-card *ngFor="let sList of sLists">
            <ion-card-content [routerLink]="sList?.url">
              <ion-grid>
                <ion-row>
                  <!-- <ion-col size="3">
                    <ion-thumbnail>
                      <img [src]="sList?.icon" width="10" height="10" />
                    </ion-thumbnail>
                  </ion-col> -->
                  <ion-col size="12">
                    <ion-card-title class="card-title">{{sList?.title}}</ion-card-title>
                  </ion-col>
                </ion-row>
              </ion-grid>
            </ion-card-content>
          </ion-card>
        </div>
      </div>
    </div>
  </div>
</ion-content>
