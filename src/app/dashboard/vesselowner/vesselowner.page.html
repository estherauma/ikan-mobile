<app-header
  [isBackButton]="false"
>
</app-header>

<ion-content>
  <div class="content-container">
    <app-dashboardelcomesection 
      [greeting]="welcomeText"
      [name]="name"
      (onProfileClick)="goToProfile()"
      >
    </app-dashboardelcomesection>

    <div class="ion-padding page-content">
      <ion-card *ngFor="let sList of sLists">
        <ion-card-content [routerLink]="sList.url">
          <ion-grid>
            <ion-row>
              <!-- <ion-col size="3">
                <ion-thumbnail>
                    <img [src]="sList.icon" width="10" height="10" />
                </ion-thumbnail>
              </ion-col> -->
              <ion-col size="12">
                <ion-card-title>{{sList.title}}</ion-card-title>
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-card-content>
      </ion-card>
    </div>
  </div>
</ion-content>
