<app-header [pageTitle]="">
</app-header>

<ion-content>
  <app-dashboardelcomesection message="Welcome back. Here’s a bespoke message on entry."
    name="Taien"></app-dashboardelcomesection>
    <div>
      <ion-card>
        <ion-card-content>
          <ion-card-title>{{performanceData.title}}</ion-card-title>
          <ion-grid>
            <ion-row class="ion-align-items-center">
              <ion-col size="4">
                <app-chart chartType="doughnut" [chartDatasets]="performanceData.datasets"></app-chart>
              </ion-col>
              <ion-col size="8">
                <ion-text>
                  <h5>41%: Statistics</h5>
                </ion-text>
                <br />
                <ion-text>
                  <p>
                    <ion-icon name="square"></ion-icon> 77%: Statistic 1
                  </p>
                </ion-text>
                <ion-text>
                  <p>
                    <ion-icon name="square"></ion-icon> 20%: Statistic 2
                  </p>
                </ion-text>
                <ion-text>
                  <p>
                    <ion-icon name="square"></ion-icon> 3%: Statistic 3
                  </p>
                </ion-text>
                <br />
                <ion-text class="ion-center"><a routerLink="/feedbackdashboard/home">Feedback Dashboard</a></ion-text>
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-card-content>
      </ion-card>
    </div>
  <div style="background-color: #F5F5F5;" class="ion-padding">
    <ion-card *ngFor="let sList of sLists">
      <ion-card-content [routerLink]="sList.url">
        <ion-grid>
          <ion-row>
            <ion-col size="3">
              <ion-thumbnail>
                  <img [src]="sList.icon" width="10" height="10" />
              </ion-thumbnail>
            </ion-col>
            <ion-col size="9">
              <ion-card-title>{{sList.title}}</ion-card-title>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
