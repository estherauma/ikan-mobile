  <div class="ion-padding">
    <ion-card *ngFor="let sList of sLists">
      <ion-card-content [routerLink]="sList.url">
        <ion-grid>
          <ion-row>
            <ion-col size="3">
              <ion-thumbnail>
                  <img [src]="sList.icon" width="10" height="10" />
              </ion-thumbnail>
            </ion-col>
            <ion-col size="9">
              <ion-card-title>{{sList.title}}</ion-card-title>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
