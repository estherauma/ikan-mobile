<app-header [showBackButton]="false"></app-header>

<ion-content>
  <div class="content-container">
    <app-dashboardelcomesection 
      [greeting]="commonText?.fdbkWelcomeText"
      [name]="name"
      (onProfileClick)="goToProfile()"
    >
    </app-dashboardelcomesection>
  
    <div class="page-content">
      <div class="ion-padding cards-wrapper">
        <div>
          <ion-card
            routerLink="/learninghub"
            class="hub-content">
            <ion-card-content>
              <ion-grid>
                <ion-row>
                  <ion-col size="12">
                    <ion-card-title class="card-title">{{commonText?.learningHub}}</ion-card-title>
                  </ion-col>
                </ion-row>
              </ion-grid>
            </ion-card-content>
          </ion-card>
        </div>
        <div>
          <ion-card *ngFor="let item of dashdoardItems">
            <ion-card-content [routerLink]="item?.url">
              <ion-grid>
                <ion-row>
                  <!-- <ion-col size="3">
                    <ion-thumbnail>
                      <img [src]="item?.icon" width="10" height="10" />
                    </ion-thumbnail>
                  </ion-col> -->
                  <ion-col size="12">
                    <ion-card-title class="card-title">{{item?.title}}</ion-card-title>
                  </ion-col>
                </ion-row>
              </ion-grid>
            </ion-card-content>
          </ion-card>
        </div>
      </div>
    </div>
  </div>
</ion-content>
