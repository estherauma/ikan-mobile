<app-header [showBackButton]="false"></app-header>

<ion-content>
  <div class="content-container">
    <app-dashboardelcomesection
      [greeting]="commonText?.fdbkWelcomeText"
      [name]="name"
      (onProfileClick)="goToProfile()"
    >
    </app-dashboardelcomesection>

    <div class="page-content">
      <div class="ion-padding cards-wrapper">
        <div class="learninghub-tfa-wrapper">
          <ion-label class="section-label">
            {{ commonText?.learning || 'Learning' }}
          </ion-label>
          <ion-row>
            <ion-col size="6">
              <ion-card
                routerLink="/learninghub"
                class="learninghub-card"
              >
                <ion-card-content>
                  <ion-card-title class="card-title">{{ commonText?.learningHub || 'Learning Hub' }}</ion-card-title>
                  <ion-icon src="assets/icon/training_blue.svg" class="card-icon"></ion-icon>
                </ion-card-content>
              </ion-card>
            </ion-col>
            <ion-col size="6">
              <ion-card
                (click)="showTrainingVideo()"
                class="tfa-video-card"
              >
                <ion-card-content>
                  <ion-card-title class="card-title">{{ commonText?.knowYourRightsVideoAndQuiz || 'Know Your Rights Video & Quiz' }}</ion-card-title>
                  <ion-icon name="play-circle-outline" class="card-icon"></ion-icon>
                </ion-card-content>
              </ion-card>
            </ion-col>
          </ion-row>
          <hr/>
        </div>
        <div class="docs-wrapper">
          <ion-label class="section-label">
            {{ commonText?.documents || 'Documents' }}
          </ion-label>
          <ion-row>
            <ion-col size="6">
              <ion-card
                routerLink="/mydocuments"
                class="my-documents-card"
              >
                <ion-card-content>
                  <ion-card-title class="card-title">{{ commonText?.myDocuments || 'My Documents' }}</ion-card-title>
                  <ion-icon src="assets/icon/documents.svg" class="card-icon"></ion-icon>
                </ion-card-content>
              </ion-card>
            </ion-col>
          </ion-row>
        </div>
      </div>
    </div>
  </div>
</ion-content>
