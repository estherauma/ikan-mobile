<app-header></app-header>

<ion-content class="ion-padding">
  <!-- TODO: add urls -->
  <div class="audio-video-section">
    <app-video-button [url]="''"></app-video-button>
    <app-audio-button [url]="''"></app-audio-button>
  </div>

  <div class="title-wrapper">
    <!-- TODO: translate -->
    <h1 class="title">My work journey</h1>
  </div>

  <div class="circle-progress-section">
    <div class="progress-container">
      <h4>Salary check</h4>
      <div class="chart-wrapper">
        <app-progress-circle
          [percentage]="30"
          outerBorderColor="unset"
          innerBorderColor="unset"
        ></app-progress-circle>
        <p>Complete</p>
      </div>
    </div>
    <div class="progress-container">
      <h4>My Docs</h4>
      <div class="chart-wrapper">
        <app-progress-circle
          [percentage]="50"
          outerBorderColor="unset"
          innerBorderColor="unset"
        ></app-progress-circle>
        <p>Complete</p>
      </div>
    </div>
  </div>

  <div class="timeline">
    <div class="start-step">
      <!-- TODO: translate -->
      <ion-chip class="start-chip">
        Start
      </ion-chip>
    </div>

    <div class="steps" [ngClass]="{'first-step-inactive': !journeyItems[0]?.isActive}">
      @for (item of journeyItems; track item) {
        <ion-row class="step">
          <ion-col size="4" class="icon-col">
            @if (item?.isActive) {
              <div class="outer-icon-wrapper">
                <div class="icon-wrapper active-icon" (click)="onClick(item?.route)">
                  <!-- <ion-icon [src]="item?.icon"></ion-icon> -->
                  <ion-icon name="person-outline"></ion-icon>
                </div>
              </div>
            }
            <!-- TODO: add disabled-icon class to inactive & incomplete item -->
            @if (!item?.isActive) {
              <div
                class="icon-wrapper inactive-icon disabled-icon"
                (click)="onClick(item?.route)"
            [ngClass]="{
              'disabled-icon': !item?.isActive && !item?.isCompleted,
              'inactive-icon': !item?.isActive && !item?.isCompleted
            }"
                >
                <!-- <ion-icon [src]="item?.icon"></ion-icon> -->
                <ion-icon name="person-outline"></ion-icon>
              </div>
            }
          </ion-col>
          <ion-col size="8" class="text-col">
            @if (item?.isActive) {
              <div class="text-wrapper">
                <h4>{{ item?.title }}</h4>
                <p>{{ item?.description }}</p>
              </div>
            }
          </ion-col>
        </ion-row>
      }
    </div>
  </div>
</ion-content>
