<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header>IKAN</ion-list-header>
          <ion-note>{{ userEmail }}</ion-note>

          <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages; let i = index">
            <ion-item
              *ngIf="p.enabled"
              routerDirection="root"
              (click)="onClick(i)"
              lines="none"
              detail="false"
              routerLinkActive="selected"
              [ngClass]="{'is-last': p.last}"
            >
              <ion-icon slot="start" [name]="p.icon"></ion-icon>
              <ion-label>{{ p.label }}</ion-label>
            </ion-item>
            <hr *ngIf="p.last" />
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
  
  <ion-content *ngIf="!appSetupComplete">
    <app-authbgpaper></app-authbgpaper>
    <div class="ion-padding content-wrapper">
      <div>
        <ion-row class="ion-justify-content-center">
          <ion-img class="icon" src="/assets/imgs/logo_svg.svg"></ion-img>
        </ion-row>
      </div>
      <div class="ion-padding-vertical loader-wrapper">
        <ion-row>
          <ion-col size="12" class="loader-center">
            <ion-img class="loader" src="/assets/imgs/loading.gif"></ion-img>
          </ion-col>
          <ion-col size="12" class="loader-center">
            <p class="loading-text">{{ commonText?.loadingText || 'Loading assets...'}}</p>
          </ion-col>
        </ion-row>
      </div>
    </div>
  </ion-content>
</ion-app>
