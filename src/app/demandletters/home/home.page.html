<app-header [pageTitle]="pageTitle">

</app-header>

<ion-content>
    <ion-img [src]="bannerImage"></ion-img>
  <ion-grid>
    <ion-row style="align-items: center;">
      <ion-col>Filter</ion-col>

      <ion-col size="auto">

        <ion-grid>
          <ion-row>

            <ion-col>
              <app-filter filterProperty="status" [options]="filterOptions" [filterDataSet]="filterDataSet" (filterResult)="filterResult($event)"></app-filter>

            </ion-col>

            <ion-col>
              <app-filter filterProperty="status" [options]="filterOptions" [filterDataSet]="filterDataSet" (filterResult)="filterResult($event)"></app-filter>
            </ion-col>

          </ion-row>
        </ion-grid>

      </ion-col>

    </ion-row>
  </ion-grid>
  <ion-card *ngFor="let dl of demandLetters">
    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col size="3" style="padding-top: 15%">
            <ion-thumbnail>
              <ion-img [src]="dl.image"></ion-img>
            </ion-thumbnail>
          </ion-col>
          <ion-col size="8">
            <ion-card-title>{{dl.name}}</ion-card-title>
            <ion-card-subtitle>Internal Ref: {{dl.internalRef}}</ion-card-subtitle>
            <br>
            <ion-label><strong>App Ref:</strong> {{dl.appRef}}</ion-label> <br>
            <ion-label><strong>Date Created:</strong> {{dl.dateOpened}}</ion-label> <br>
            <ion-label><strong>Status:</strong> {{dl.status}}</ion-label>
          </ion-col>
          <ion-col size="1" style="text-align: center; padding-top: 15%" (click)="viewDeatils(dl)">
            <ion-icon name="chevron-forward-outline" size="large"></ion-icon>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="createDemandLetter()">
      <ion-icon name="add-circle-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
