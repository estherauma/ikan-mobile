<app-header [pageTitle]="pageTitle"></app-header>

<ion-content class="ion-padding">
  <ion-grid class="ion-margin-top">
    <ion-row class="ion-margin-top ion-align-items-center">
      <ion-col size="12" class="" style="padding: 0px;">
        <ion-thumbnail style="width: 80px; height: 80px; margin-bottom: 8px;">
          <ion-img [src]="demandLetter.image"></ion-img>
        </ion-thumbnail>
        <ion-card-title>Send Demand Letter</ion-card-title>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div>
  <ion-label><strong>Demand letter details</strong></ion-label>
  <ion-card>
    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col size="3" style="padding-top: 15%">
            <ion-thumbnail>
              <ion-img [src]="demandLetter.image"></ion-img>
            </ion-thumbnail>
          </ion-col>
          <ion-col size="8">
            <ion-card-title>{{demandLetter.name}}</ion-card-title>
            <ion-card-subtitle>Internal Ref: {{demandLetter.internalRef}}</ion-card-subtitle>
            <br>
            <ion-label><strong>App Ref:</strong> {{demandLetter.appRef}}</ion-label> <br>
            <ion-label><strong>Date Created:</strong> {{demandLetter.dateOpened}}</ion-label> <br>
            <ion-label><strong>Status:</strong> {{demandLetter.status}}</ion-label>
          </ion-col>
          <ion-col size="1" style="text-align: center; padding-top: 15%" (click)="viewDeatils(demandLetter)">
            <ion-icon name="chevron-forward-outline" size="large"></ion-icon>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
  </div>

  <div>
    <ion-label><strong>Recipient</strong></ion-label>
    <ion-select 
    style="border: 2px solid gray; border-radius:10px;" 
    placeholder="Select Recipient"
    (ionChange)="onRecipientSelect($event)"
    >
      <ion-select-option value="justineokumu@50eight.com">justineokumu@50eight.com</ion-select-option>
      <ion-select-option value="samsonkapeyi@50eight.com">samsonkapeyi@50eight.com</ion-select-option>
    </ion-select>
  </div>

  <ion-button class="display-block" (click)="onSendDemandLetter()">
    Send
  </ion-button>

</ion-content>
