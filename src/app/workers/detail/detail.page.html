<app-header [isBackButton]="true"></app-header>

<ion-content class="content-skyblue-bg ion-content-custom-position">
  <app-pageprofilecontainer
    (clickedMenuItem)="onClickedMenu($event)"
    [active]="activeNavItem"
    [navItems]="navItems"
    [status]="workerStatus"
    [title]="workerInfo?.firstName || '' + ' ' + workerInfo?.lastName || ''"
    [isResendInviteBtn]="isResendInviteBtn && workerInfo?.status?.toLowerCase().includes('pending')"
    [imageUrl]="workerInfo?.profileImage"
    [worker]="workerInfo"
  ></app-pageprofilecontainer>

<div class="contents">
  <div *ngIf="activeNavItem.id === 'workers-info'">
    <div class="row-container">
      <ion-row>
        <ion-col size="2" class="icon-container">
          <ion-img src="assets/icon/email_blue.svg"></ion-img>
        </ion-col>
        <ion-col size="10" class="value-container">
          <p>{{workerInfo?.email}}</p>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="2" class="icon-container">
          <ion-img src="assets/icon/phone_blue.svg"></ion-img>
        </ion-col>
        <ion-col size="10" class="value-container">
        <p>{{workerInfo?.telephone || workerInfo?.mobile}}</p>
        <p *ngIf="workerInfo?.telephone && workerInfo?.mobile">{{workerInfo?.mobile}}</p>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="2" class="icon-container">
          <ion-img src="assets/icon/office_blue.svg"></ion-img>
        </ion-col>
        <ion-col size="10" class="value-container">
          <p *ngIf="workerInfo?.addressLine1">{{workerInfo?.addressLine1}}</p>
          <p *ngIf="workerInfo?.addressLine2">{{workerInfo?.addressLine2}}</p>
          <p *ngIf="workerInfo?.addressLine3">{{workerInfo?.addressLine3}}</p>
          <p *ngIf="workerInfo?.city">{{workerInfo?.city}}</p>
          <p *ngIf="workerInfo?.country">{{workerInfo?.country}}</p>
          <p *ngIf="workerInfo?.postalCode">{{workerInfo?.postalCode}}</p>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12"class="edit-btn-container">
          <app-button
            class="info-edit-btn"
            (onClick)="onEdit(workerInfo)"
            [title]="commonText?.edit"
            size="small"
          ></app-button>
        </ion-col>
      </ion-row>
    </div>
  </div>

  <div *ngIf="activeNavItem.id === 'workers-payment'">
    <app-payments
      page="vo-workers-payments"
      [workerInfo]="workerInfo"
    ></app-payments>
  </div>
