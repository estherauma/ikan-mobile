<app-header [pageTitle]=""></app-header>

<ion-content>
  <app-pageprofilecontainer
  (clickedMenuItem)="onClickedMenu($event)"
  [active]="activeNavItem"
  [navItems]="navItems"
  [status]="workerInfo.status"
  [title]="workerInfo.name"
  [isResendInviteBtn]="isResendInviteBtn"
  imageUrl="/assets/imgs/zila1.jpeg"
  ></app-pageprofilecontainer>

<div class="ion-padding contents">
  <div *ngIf="activeNavItem.id === 1">
    <div>
      <div class="text-icon">
        <div class="icon">
          <ion-img src="assets/icon/email_blue.svg"></ion-img>
        </div>
        <p>{{workerInfo.email}}</p>
      </div>
      <div class="text-icon">
        <div class="icon">
          <ion-img src="assets/icon/phone_blue.svg"></ion-img>
        </div>
        <p>{{workerInfo.phone}}</p>
      </div>
      <div class="liner">
        <div class="icon">
          <ion-img src="assets/icon/office_blue.svg"></ion-img>
        </div>
        <div>
          <p>{{workerInfo.building}}</p>
          <p>{{workerInfo.street}}</p>
          <p>{{workerInfo.county}}</p>
          <p>{{workerInfo.town}}</p>
          <p>{{workerInfo.zipCode}}</p>
          <p>{{workerInfo.country}}</p>
        </div>
      </div>
      <div class="edit-btn-container">
        <app-button (onClick)="onEdit()" title="Edit" size="small"></app-button>
      </div>
    </div>
  </div>
  <div *ngIf="activeNavItem.id === 2">
    <div class="title-wrapper">
      <app-title title="Account information" variant="h5"></app-title>
      <app-button title="Save" size="small"></app-button>
    </div>
    <app-form
    [tunaFormGroup]="pageFormGroup"
    [tunaFormquestions]="formQuestions"
    [submitButtonText]="submitButtonText"
    (formValue)="onSubmit($event)"
    [isTextBlue]="true"
    [isOtherDarkBlue]="true"
    [isTitleDarkBlue]="true"
    btnFill="solid"
    >
</app-form>      
  </div>
  <div *ngIf="activeNavItem.id === 3">
    <p>placement contents</p>
  </div>
  <div *ngIf="activeNavItem.id === 4">
    <p>documents contents</p>
  </div>
  <div *ngIf="activeNavItem.id === 5">
    <p>training contents</p>
  </div>
</div>
</ion-content>
