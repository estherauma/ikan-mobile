<app-header [pageTitle]=""></app-header>

<ion-content class="content-skyblue-bg ion-content-custom-position">
  <div class="ion-padding">
    <div class="title-wrapper">
      <app-title [isBig]="true" title="Edit"></app-title>
    </div>
    <app-form
    [tunaFormGroup]="pageFormGroup"
    [tunaFormquestions]="formQuestions"
    [submitButtonText]="submitButtonText"
    (formValue)="onSubmit($event)"
    [isTextBlue]="true"
    [isOtherDarkBlue]="true"
    [isTitleDarkBlue]="true"
    btnFill="solid"
  >
  </app-form>
  </div>
</ion-content>
