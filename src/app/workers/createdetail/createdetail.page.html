<app-header></app-header>

<ion-content class="ion-padding content-skyblue-bg ion-content-custom-position">
  <app-contentwrapper>
    <div>
      <div class="title-wrapper">
        <app-title [isBig]="true" [title]="pageTitle"></app-title>
      </div>
      <app-form
        [tunaFormGroup]="pageFormGroup"
        [tunaFormquestions]="formQuestions"
        [submitButtonText]="submitButtonText"
        (formValue)="onSubmit($event)"
        [isTextBlue]="true"
        [isOtherDarkBlue]="true"
        [isTitleDarkBlue]="true"
        btnFill="solid"
      >
      </app-form>
    </div>
  </app-contentwrapper>
</ion-content>
