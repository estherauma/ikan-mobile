
<ion-content [fullscreen]="true">
  <app-form
    class="worker-profile-payment-acct"
    [tunaFormGroup]="acctFormGroup"
    [tunaFormquestions]="acctFormQtns"
    [submitButtonText]="submitButtonText"
    (formValue)="onSubmitAccount($event)"
  >
  </app-form>

  <app-form
    class="worker-profile-payment-beneficiary"
    [tunaFormGroup]="beneficiaryFormGroup"
    [tunaFormquestions]="beneficiaryFormQtns"
    [submitButtonText]="submitButtonText"
    (formValue)="onSubmitBeneficiary($event)"
  >
  </app-form>
