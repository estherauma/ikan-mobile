
<ion-content>
  <app-form
      [tunaFormGroup]="pageFormGroup"
      [tunaFormquestions]="formQuestions"
      [submitButtonText]="submitButtonText"
      (formValue)="onSubmit($event)">
  </app-form>
  <div class="ion-padding" style="background-color: #e6e6e6;">
    <ion-text><h1>{{ commonText?.viewPaymentHistory }}</h1></ion-text>
    <ion-card>
      <ion-card-content>
        <ion-grid>
          <ion-row>
            <ion-col size="3" style="padding-top: 15%">
              <ion-thumbnail>
                <ion-img [src]=""></ion-img>
              </ion-thumbnail>
            </ion-col>
            <ion-col size="8">
              <ion-card-title>{{commonText?.allPayments }} (5)</ion-card-title>
              <ion-label>{{ commonText?.AdditionalInformation }}</ion-label>
            </ion-col>
            <ion-col size="1" style="text-align: center; padding-top: 15%" (click)="viewAll()">
              <ion-icon name="chevron-forward-outline" size="large"></ion-icon>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>
  </div>      
</ion-content>
