<app-header [pageTitle]=""></app-header>

<ion-content>
  <div class="tabContent">
    <ion-tabs>
      <ion-tab-bar slot="bottom">
        <ion-tab-button tab="info">
          <ion-icon name="person-circle-outline"></ion-icon>
          <ion-label>{{ commonText?.info }}</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="payments">
          <ion-icon name="wallet-outline"></ion-icon>
          <ion-label>{{ commonText?.paymentInfo }}</ion-label>
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  </div>
</ion-content>
