<app-header></app-header>

<ion-content [fullscreen]="true">
  <div class="profile-preview">
    <ion-row class="title-wrapper">
      <h1>{{ pageTitle }}</h1>
    </ion-row>

    <ion-row>
      <ion-col size="12">
        <div class="img-wrapper">
          @if (!imageUrl) {
            <ion-icon
              class="image icon"
              name="person-circle-outline"
              />
          }
          @if (sharedMethods.isIos && imageUrl) {
            <img
              class="image img"
              [src]="imageUrl | safeurl"
              />
          }
          @if (sharedMethods.isAndroid && imageUrl) {
            <img
              class="image img"
              [src]="imageUrl"
              />
          }
          <ion-icon
            class="edit-icon"
            [ngClass]="{ 'edit-icon-default-img': !imageUrl }"
            name="pencil"
            (click)="changePhoto()"
          ></ion-icon>
        </div>
      </ion-col>
      <!-- TO BE REMOVED -->
      <!-- <ion-col size="12">
      <p [ngClass]="{ 'p-with-image': imageUrl}" (click)="changePhoto()">{{ 'Change Photo' }}</p>
    </ion-col> -->
  </ion-row>
</div>

<div class="segments-wrapper">
  <div class="segments">
    <ion-segment (ionChange)="onSegmentChange($event)" [value]="activeSegment">
      <ion-segment-button value="info">
        <ion-item lines="none">
          <ion-icon item-start name="person-circle-outline"></ion-icon>
          <ion-label>{{ commonText?.info }}</ion-label>
        </ion-item>
      </ion-segment-button>
      <ion-segment-button value="payments">
        <ion-item lines="none">
          <ion-icon name="wallet-outline"></ion-icon>
          <ion-label>{{ commonText?.payment }}</ion-label>
        </ion-item>
      </ion-segment-button>
    </ion-segment>
  </div>

  <div class="segment-content">
    @if (activeSegment === 'info') {
      <app-profiles-info
        class="segement-info"
        >
      </app-profiles-info>
    }
    @if (activeSegment === 'payments') {
      <app-payments
        class="segment-payments"
        >
      </app-payments>
    }
  </div>
</div>
</ion-content>
