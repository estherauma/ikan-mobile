<app-header [pageTitle]=""></app-header>


<ion-content>
  <div class="ion-padding">
    <ion-row>
      <ion-col size="8">
        <div class="logo-container">
          <ion-thumbnail class="logo">
            <ion-img [src]=""></ion-img>
          </ion-thumbnail>
        </div>
        <ion-text><h1>Training</h1></ion-text>
      </ion-col>
      <ion-col size="4">
        <div (click)="toTrainingStatus()" style="cursor:move;">
          <app-chart chartType="doughnut" [chartDatasets]="datasets"></app-chart>
        </div>
      </ion-col>
    </ion-row> 
  </div>
  <app-search [searchDataSet]="searchAndFilterDataSet" (searchResult)="searchResult($event)"></app-search>
  <ion-grid>
    <ion-row style="align-items: center;">
      <ion-col>Filter</ion-col>
      <ion-col size="auto">

        <ion-grid>
          <ion-row>

            <ion-col>
              <app-filter filterProperty="status" [options]="filterOptions" [filterDataSet]="searchAndFilterDataSet" (filterResult)="filterResult($event)"></app-filter>
            </ion-col>

            <ion-col>
              <app-filter filterProperty="status" [options]="filterOptions" [filterDataSet]="searchAndFilterDataSet" (filterResult)="filterResult($event)"></app-filter>
            </ion-col>

          </ion-row>
        </ion-grid>

      </ion-col>
    </ion-row>
  </ion-grid>
  <ion-accordion-group>
    <ion-accordion [value]="i" *ngFor="let training of trainings;  let i = index">
      <ion-item slot="header" color="light">
        <div class="training-title-container">
          <ion-label>{{training.title}}</ion-label>
          <div class="training-progress-container">
            <div class="training-progress-bar">
              <ion-progress-bar value="0.8"></ion-progress-bar>
            </div>
            <ion-label><small>4/5(80%)</small></ion-label>
          </div>
        </div>
      </ion-item>
      <div class="ion-padding" slot="content">
        <ion-card (click)="onQuestionClick()" *ngFor="let question of training.questions" class="white-bg">
          <ion-card-content>
            <ion-grid>
              <ion-row class="ion-align-items-center">
                <ion-col size="3">
                  <ion-thumbnail>
                    <ion-img src=""></ion-img>
                  </ion-thumbnail>
                </ion-col>
                <ion-col size="8">
                  <ion-card-title>QUESTION TIME!</ion-card-title>
                  <ion-icon name="checkmark-circle-outline"></ion-icon>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-card-content>
        </ion-card>
      </div>
    </ion-accordion>
  </ion-accordion-group>
</ion-content>
