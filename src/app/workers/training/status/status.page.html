<app-header [pageTitle]=""></app-header>

<ion-content>
  <div>
    <div class="ion-padding-vertical" style="background-color: #F5F5F5;">
      <ion-row class="ion-align-items-end">
        <ion-col size="8">
          <ion-text><h1>Training Status</h1></ion-text>
        </ion-col>
        <ion-col size="4">
            <app-chart chartType="doughnut" [chartDatasets]="datasets"></app-chart>
        </ion-col>
      </ion-row> 
    </div>
    <div class="ion-padding-vertical">
      <ion-grid *ngFor="let trainingStatus of trainingStatuses">
        <ion-row>
          <ion-col size="12">
            <ion-label>{{trainingStatus.title}}</ion-label>
          </ion-col>
        </ion-row>
        <ion-row class="ion-align-items-center">
          <ion-col size="10"><ion-progress-bar [value]="trainingStatus.percentage/100"></ion-progress-bar></ion-col>
          <ion-col size="2">{{trainingStatus.percentage}}%</ion-col>
        </ion-row>
      </ion-grid>
      <div class="ion-padding">
        <ion-text><h3>BP2mi Training document</h3></ion-text>
        <ion-text><a>Status: Complete   View doc</a></ion-text>
      </div>
      <ion-text><h1 class="ion-padding-start">Learning Hub</h1></ion-text>
      <ion-grid *ngFor="let learningHubStatus of learningHubStatuses">
        <ion-row>
          <ion-col size="12">
            <ion-label>{{learningHubStatus.title}}</ion-label>
          </ion-col>
        </ion-row>
        <ion-row class="ion-align-items-center">
          <ion-col size="10"><ion-progress-bar [value]="learningHubStatus.percentage/100"></ion-progress-bar></ion-col>
          <ion-col size="2">{{learningHubStatus.percentage}}%</ion-col>
        </ion-row>
      </ion-grid>
    </div>
    <div class="ion-padding"  style="background-color: #F5F5F5;">
      <ion-text><h1>Audio notes</h1></ion-text>
      <div (click)="onRecord()">
        <ion-row class="ion-align-items-center">
          <ion-col size="3">
            <div style="background-color: #e5e5e5; height: 60px; width: 60px; border-radius: 50px; display: flex; justify-content:center; align-items: center;">
              <ion-icon size="large" name="mic-outline"></ion-icon>
            </div>
          </ion-col>
          <ion-col size="9">
            <ion-text>Record new note</ion-text>
          </ion-col>
        </ion-row>
      </div>
      <div class="ion-padding-vertical">
        <ion-row *ngFor="let audioRecording of audioRecordings" class="ion-justify-content-between ion-align-items-center">
          <ion-col size="12"><ion-label>{{audioRecording.name}}</ion-label></ion-col>
          <ion-col size="6">
              <div>
                <audio controls autobuffer="autobuffer">
                  <source [src]="audioRecording.file">
                  Your browser does not support the audio tag.
                </audio>
              </div>
          </ion-col>
          <ion-col size="2">
            <ion-icon (click)="onDelete(audioRecording.uniqueName)" size="large" name="trash-outline"></ion-icon>
          </ion-col>
        </ion-row>
      </div>
    </div>
  </div>
</ion-content>
