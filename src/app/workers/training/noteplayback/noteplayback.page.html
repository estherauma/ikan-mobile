<app-header [pageTitle]=""></app-header>

<ion-content>
  <ion-grid>
    <ion-row class="ion-align-content-between">
      <ion-col size="12">
        <ion-text><h1>Raise a question</h1></ion-text>
      </ion-col>
      <ion-col size="12">
        <ion-row class="ion-justify-content-between ion-align-items-center" style="height: 70vh;">
          <ion-col size="6">
              <div>
                <audio controls autobuffer="autobuffer">
                  <source [src]="audioNote">
                  Your browser does not support the audio tag.
                </audio>
              </div>
          </ion-col>
          <ion-col size="2">
            <ion-icon (click)="onDelete()" size="large" name="trash-outline"></ion-icon>
          </ion-col>
        </ion-row>
      </ion-col>
      <ion-col size="12">
        <ion-button (click)="onSave()" expand="full">Save</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
