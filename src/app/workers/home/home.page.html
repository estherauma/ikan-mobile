<app-header [pageTitle]=""></app-header>

<ion-content class="content-skyblue-bg ion-content-custom-position">
  <app-contentwrapper>

  <div>
    <ion-grid class="ion-margin-bottom ion-margin-top">
      <ion-row class="ion-align-items-center">
        <ion-col size="2">
          <img src="/assets/icon/workorders_blue.svg" width="20" height="40" />
        </ion-col>
        <ion-col size="10" class="ion-justify-content-end">
          <div class="ion-justify-content-end">
            <app-button (onClick)="createWorker()" iconName="add-outline" [title]="commonText?.newWorker"></app-button>
          </div>
        </ion-col>
      </ion-row>
      <ion-row class="ion-padding-bottom title">
        <app-title [isBlue]="true" [title]="pageTitle"></app-title>
      </ion-row>
    </ion-grid>

    <!-- search and filters -->
    <div class="ion-margin-top">
      <app-search
        [searchDataSet]="workers"
        (searchResult)="searchResult($event)"
        (clear)="clearSearchResult()">
      </app-search>
      <ion-grid>
        <ion-row>
          <ion-text class="filter-title">{{ commonText?.filter }}</ion-text>
        </ion-row>
        <ion-row>
          <ion-col>
            <app-filter
              type="deep-blue-90"
              filterProperty="status"
              [options]="filterOptions"
              [filterDataSet]="workers"
              (filterResult)="filterResult($event)"
              [filterLabel]="commonText?.filterByStatus"
            ></app-filter>
          </ion-col>

          <ion-col>
            <app-filter
              type="deep-blue-90"
              filterProperty="status"
              [options]="filterOptions"
              [filterDataSet]="workers"
              (filterResult)="filterResult($event)"
              [filterLabel]="commonText?.filterByStatus"
            ></app-filter>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>
  </div>

  <div>
    <app-workercard (click)="viewDetails(worker)" *ngFor="let worker of workers" [worker]="worker"></app-workercard>
  </div>
  </app-contentwrapper>
</ion-content>
