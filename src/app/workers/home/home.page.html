<app-header [pageTitle]=""></app-header>

<ion-content class="content-skyblue-bg">

  <div class="ion-padding">
    <ion-grid class="ion-margin-bottom">
      <ion-row class="ion-justify-content-between ion-align-items-baseline">
        <ion-col>
          <img src="/assets/icon/workorders_blue.svg" width="20" height="40" />
        </ion-col>
        <ion-col>
          <ion-row class="ion-justify-content-end">
            <div>
              <app-button (onClick)="createWorker()" iconName="add-outline" title="New Worker"></app-button>
            </div>
          </ion-row>
        </ion-col>
      </ion-row>
      <ion-row class="ion-padding-bottom title">
        <app-title [isBlue]="true" [title]="pageTitle"></app-title>
      </ion-row>
    </ion-grid>

    <!-- search and filters -->
    <div class="ion-margin-top">
      <app-search [searchDataSet]="workers" (searchResult)="searchResult($event)"></app-search>
      <ion-grid>
        <ion-row>
          <ion-text class="filter-title">Filter</ion-text>
        </ion-row>
        <ion-row>
          <ion-col>
            <app-filter type="deep-blue-90" filterProperty="status" [options]="filterOptions"
              [filterDataSet]="workers" (filterResult)="filterResult($event)"></app-filter>
          </ion-col>

          <ion-col>
            <app-filter type="deep-blue-90" filterProperty="status" [options]="filterOptions"
              [filterDataSet]="workers" (filterResult)="filterResult($event)"></app-filter>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>
  </div>

  <app-workercard *ngFor="let worker of workers" [worker]="worker"></app-workercard>

</ion-content>
