<app-header [pageTitle]=""></app-header>

<ion-content class="content-skyblue-bg">
  <ion-grid>
    <div class="title-search-filter">
      <!-- Create functionality disabled for now -->
      <!-- <ion-row class="ion-justify-content-end">
        <app-button
          iconName="add-outline"
          [title]="commonText?.new"
        ></app-button>
      </ion-row> -->

      <ion-row class="title-row">
        <ion-col size="12">
          <ion-img src="assets/icon/payments.svg" class="icon"></ion-img>
        </ion-col>
        <ion-col size="12">
          <app-title
            class="payments-page"
            [title]="commonText?.payments"
            [isBlue]="true"
          ></app-title>
        </ion-col>
      </ion-row>

      <!-- TODO: change search/filter datasets according to role -->
      <!-- Search functionality disabled for now -->
      <!-- <ion-row class="search-row">
        <ion-col size="12">
          <app-search
            [searchDataSet]="filterDataSet"
            (searchResult)="searchResult($event)"
          ></app-search>
        </ion-col>
      </ion-row> -->

      <ion-row class="filter-row">
        <ion-col size="12">
          <app-filter
            filterProperty="status"
            [options]="filterOptions"
            [filterDataSet]="filterDataSet"
            (filterResult)="filterResult($event)"
            [filterLabel]="commonText?.filterByStatus"
          ></app-filter>
        </ion-col>
      </ion-row>
    </div>

    <!-- Vessel Owner View -->
    <div *ngIf="currentUser?.role==='vessel_owner'" class="vo-view">
      <ion-row
        *ngFor="let vessel of vessels"
        class="vessel-row"
        (click)="goToVesselPayments(vessel)"
      >
        <ion-col size="3" class="icon-col">
          <div class="icon-wrapper">
            <ion-img
              class="icon"
              src="assets/icon/boat_with_blue_bg.svg"
            ></ion-img>
          </div>
        </ion-col>

        <ion-col size="9" class="name-col">
          <ion-card-title class="name"> {{vessel?.name}}</ion-card-title>
        </ion-col>
      </ion-row>
    </div>

    <!-- Worker/Fisher View -->
    <div *ngIf="currentUser?.role==='worker'" class="worker-view">
      <ion-row class="sub-title-row">
        <ion-col size="12">
          <p class="sub-title">
            {{ commonText?.paymentHistory }}
            <span *ngIf="userPayments?.length">
              ({{ userPayments?.length + ' ' + commonText?.payments }})
            </span>
          </p>
        </ion-col>
        <!-- No existing payments -->
        <ion-col *ngIf="!userPayments?.length" size="12">
          <p class="no-payments">
            {{ commonText?.noPayments || 'No payments made yet.' }}
          </p>
        </ion-col>
      </ion-row>

      <div *ngFor="let payment of userPayments" class="payment-wrapper">
        <app-paymentbreakdowncard
          [statusClass]="{
                  'pending': payment.status === 'Pending',
                  'confirmed': payment.status === 'Confirmed',
                  'rejected': payment.status === 'Rejected',
                }"
          [status]="payment?.status"
          iconUrl="assets/icon/single_payment_blue.svg"
          currency="$"
          [amount]="payment?.totalUsdAmountReceived"
          [paymentMadeOn]="payment?.paymentDate"
          (onClick)="goToPaymentDetail(payment)"
        >
        </app-paymentbreakdowncard>
      </div>
    </div>
  </ion-grid>
</ion-content>
