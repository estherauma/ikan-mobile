<app-header [pageTitle]="pageTitle"></app-header>

<ion-content>
  <app-search [searchDataSet]="organizations" (searchResult)="searchResult($event)"></app-search>
  <ion-grid>
    <ion-row style="align-items: center;">
      <ion-col>Filter</ion-col>

      <ion-col size="auto">

        <ion-grid>
          <ion-row>

            <ion-col>
              <app-filter filterProperty="status" [options]="filterOptions" [filterDataSet]="filterDataSet" (filterResult)="filterResult($event)"></app-filter>

            </ion-col>

            <ion-col>
              <app-filter filterProperty="status" [options]="filterOptions" [filterDataSet]="filterDataSet" (filterResult)="filterResult($event)"></app-filter>
            </ion-col>

          </ion-row>
        </ion-grid>

      </ion-col>

    </ion-row>
  </ion-grid>
  <ion-card *ngFor="let org of organizations">
    <ion-grid>
      <ion-row>
        <ion-col size="2" class="center-in-card">
          <ion-icon name="expand-outline" size="large"></ion-icon>
        </ion-col>

        <ion-col size="8">
          <ion-text> <h5>{{org.name}} </h5></ion-text>
          <ion-text><p>Additional information required</p></ion-text>
        </ion-col>

        <ion-col size="2" class="center-in-card" (click)="viewDetails(org)">
          <ion-icon name="chevron-forward-outline" size="large"></ion-icon>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card>
</ion-content>
