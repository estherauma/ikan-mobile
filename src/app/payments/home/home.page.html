<app-header [pageTitle]="pageTitle"></app-header>

<ion-content>
  <app-search [searchDataSet]="payments" (searchResult)="searchResult($event)"></app-search>

  <ion-card *ngFor="let p of payments">
    <ion-grid>
      <ion-row>
        <ion-col size="2" class="center-in-card">
          <ion-icon name="expand-outline" size="large"></ion-icon>
        </ion-col>

        <ion-col size="8">
          <ion-text> <h5>{{p.name}} </h5></ion-text>
          <ion-text><p>Additional information required</p></ion-text>
        </ion-col>

        <ion-col size="2" class="center-in-card" (click)="viewDetails(p)">
          <ion-icon name="chevron-forward-outline" size="large"></ion-icon>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card>
</ion-content>
