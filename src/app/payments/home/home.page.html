<app-header [pageTitle]=""></app-header>

<ion-content class="content-skyblue-bg">
  <ion-grid>
    <ion-row class="title-row">
      <ion-col size="12">
        <ion-img src="/assets/icon/payments.svg" class="icon"></ion-img>
      </ion-col>
      <ion-col size="12">
        <app-title class="payments-page" [title]="commonText?.payments" [isBlue]="true"></app-title>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- <app-contentwrapper> -->
  <div>
    <div class="ion-padding-horizontal ion-padding-bottom"></div>
    <app-search
      [searchDataSet]="filterDataSet"
      (searchResult)="searchResult($event)"
    ></app-search>
  </div>
  <ion-grid>
    <ion-row>
      <ion-col size="12"
        ><ion-text class="filter">{{ commonText?.filter }}</ion-text></ion-col
      >
      <ion-col size="12">
        <ion-grid>
          <ion-row>
            <ion-col>
              <app-filter
                filterProperty="status"
                [options]="filterOptions"
                [filterDataSet]="filterDataSet"
                (filterResult)="filterResult($event)"
                [filterLabel]="commonText?.filterByStatus"
              ></app-filter>
            </ion-col>
            <ion-col>
              <app-filter
                filterProperty="status"
                [options]="filterOptions"
                [filterDataSet]="filterDataSet"
                (filterResult)="filterResult($event)"
                [filterLabel]="commonText?.filterByStatus"
              ></app-filter>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Vessel Owner View -->
  <app-maincard
    cardTitleSize="small"
    (click)="viewDetails(org)"
    *ngFor="let org of organizations"
    imagePosition="left"
    imageUrl="/assets/icon/image_placeholder.svg"
    imageShape="rounded"
    [title]="org.name"
    [text]="vesselCompanyText"
  ></app-maincard>

  <!-- Worker/ Fisher -->
  <!-- </app-contentwrapper> -->
</ion-content>
