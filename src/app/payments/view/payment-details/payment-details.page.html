<app-header></app-header>

<ion-content class="content-skyblue-bg">
  <div class="summary-wrapper">
    <ion-card class="summary-card">
      <ion-card-content>
        <div class="icon-wrapper">
          <!-- TODO: change icon according to status -->
          <ion-icon [src]="paymentIconUrl" class="icon"></ion-icon>
        </div>
        <h3>
          <!-- TODO: add currency -->
          <span>{{paymentDetails?.currency || '$'}}</span>
          {{paymentDetails?.totalAmount}}
        </h3>
        <h4 class="text-content">{{paymentDetails?.companyName}}</h4>
        <p class="status">
          {{ commonText?.status }}: {{paymentDetails?.status}}
        </p>
      </ion-card-content>
    </ion-card>
  </div>

  <div class="sub-title-wrapper">
    <!-- TODO: translate -->
    <p class="sub-title">
      {{ commonText?.paymentBreakdown || 'Payment Breakdown' }}
    </p>
  </div>

  <!-- TODO: display if payment has bank transfer -->
  <div class="bank-transfer-wrapper">
    <app-paymentbreakdowncard
      [statusClass]="{
                  'pending': paymentDetails?.status === 'Pending',
                  'confirmed': paymentDetails?.status === 'Confirmed',
                  'rejected': paymentDetails?.status === 'Rejected',
                }"
      [status]="paymentDetails?.status"
      iconUrl="assets/icon/bank.svg"
      [amount]="paymentDetails?.totalAmount || '0'"
      [currency]="paymentDetails?.currency || '$'"
      [paymentMadeOn]="paymentDetails?.createdAt"
      [paymentConfirmedOn]="paymentDetails?.confirmedDate"
      [showType]="true"
      type="Bank transfer"
    >
    </app-paymentbreakdowncard>
  </div>

  <!-- TODO: display if payment has cash transaction -->
  <div class="cash-transaction-wrapper">
    <app-paymentbreakdowncard
      [statusClass]="{
                  'pending': paymentDetails?.status === 'Pending',
                  'confirmed': paymentDetails?.status === 'Confirmed',
                  'rejected': paymentDetails?.status === 'Rejected',
                }"
      [status]="paymentDetails?.status"
      iconUrl="assets/icon/cash.svg"
      [amount]="paymentDetails?.cashAmount || '0'"
      [currency]="paymentDetails?.currency || '$'"
      [paymentMadeOn]="paymentDetails?.createdAt"
      [paymentConfirmedOn]="paymentDetails?.confirmedDate"
      [showType]="true"
      type="Cash"
    >
    </app-paymentbreakdowncard>
  </div>

  <!-- TODO: display if payment has beneficiary -->
   <!-- Add translations -->
  <div class="beneficiary-wrapper">
    <app-paymentbreakdowncard
      [statusClass]="{
                  'pending': paymentDetails?.status === 'Pending',
                  'confirmed': paymentDetails?.status === 'Confirmed',
                  'rejected': paymentDetails?.status === 'Rejected',
                }"
      [status]="paymentDetails?.status || 'Confirmed'"
      iconUrl="assets/icon/beneficiary.svg"
      [amount]="paymentDetails?.totalAmount || '999'"
      [currency]="paymentDetails?.currency || '$'"
      [paymentMadeOn]="paymentDetails?.createdAt"
      [paymentConfirmedOn]="paymentDetails?.confirmedDate"
      [showType]="true"
      type="Beneficiary"
      [showConfirmationPrompt]="true"
      [showGrievancePrompt]="true"
    >
    </app-paymentbreakdowncard>
  </div>

  <!-- TODO: for VO view add button linking to the web data upload -->
</ion-content>
