<app-header [pageTitle]="pageTitle"></app-header>

<ion-content>
  <app-search  [searchDataSet]="orgPayments" [searchProperty]="" (searchResult)="searchResult($event)"></app-search>

  <div *ngFor="let p of orgPayments" >
    <ion-text><h6 style="padding-left: 15px">{{p.date}}</h6></ion-text>
    <ion-card *ngFor="let x of p.payments">
      <ion-grid>
        <ion-row>
          <ion-col size="2" class="center-in-card">
            <ion-icon name="expand-outline" size="large"></ion-icon>
          </ion-col>

          <ion-col size="8">
            <ion-text > <h5>{{x.title}} </h5></ion-text>
            <ion-text><p>{{x.subtitle}} | {{x.status}}</p></ion-text>
          </ion-col>

          <ion-col size="2" class="center-in-card" (click)="viewDetails(x)">
            <ion-icon name="chevron-forward-outline" size="large"></ion-icon>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card>
  </div>
</ion-content>
