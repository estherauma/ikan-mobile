<app-header [pageTitle]="pageTitle"></app-header>

<ion-content class="content-skyblue-bg">
  <ion-grid>
    <div class="title-filter">
      <ion-row class="title-row">
        <ion-col size="12">
          <ion-img src="assets/icon/payments.svg" class="icon"></ion-img>
        </ion-col>
        <ion-col size="12">
          <app-title
            class="vessel-payments-page"
            [title]="vessel?.name + ' ' + paymentsCommonText?.payments"
            [isBlue]="true"
          ></app-title>
        </ion-col>
      </ion-row>

      <!-- TODO: change search/filter datasets according to role -->
      <!-- Search functionality disabled for now -->
      <!-- <ion-row class="search-row">
        <ion-col size="12">
          <app-search
            [searchDataSet]="filterDataSet"
            (searchResult)="searchResult($event)"
          ></app-search>
        </ion-col>
      </ion-row> -->

      <ion-row class="filter-row">
        <ion-col size="12">
          <app-filter
            filterProperty="status"
            [options]="filterOptions"
            [filterDataSet]="filterDataSet"
            (filterResult)="filterResult($event)"
            [filterLabel]="commonText?.filterByStatus"
          ></app-filter>
        </ion-col>
      </ion-row>
    </div>

    <div class="payments-display">
      <ion-row class="sub-title-row">
        <ion-col size="12">
          <p class="sub-title">
            {{ paymentsCommonText?.paymentHistory }}
            <span *ngIf="vesselPayments?.length">
              ({{ vesselPayments?.length + ' ' + paymentsCommonText?.payments }})
            </span>
          </p>
        </ion-col>
        <!-- No existing payments -->
        <ion-col *ngIf="!vesselPayments?.length" size="12">
          <p class="no-payments">
            {{ paymentsCommonText?.noPayments }}
          </p>
        </ion-col>
      </ion-row>

      <!-- TODO: group payments by date -->
      <ion-list
        *ngIf="vesselPayments?.length && groupedVesselPayments?.length"
        class="list-wrapper"
      >
        <div *ngFor="let group of groupedVesselPayments; let i = index">
          <ion-item
            (click)="toggleGroup(i)"
            class="group-item"
            [ngClass]="{'not-expanded': !group.isExpanded}"
            button
          >
            <ion-label>{{ group?.date }}</ion-label>
            <ion-icon
              [name]="group.isExpanded ? 'chevron-up' : 'chevron-down'"
              slot="end"
            ></ion-icon>
          </ion-item>

          <div *ngIf="group.isExpanded" class="group-list-wrapper">
            <div
              *ngFor="let payment of group.payments"
              class="payment-item"
            >
              <!-- TODO: check whther to use createdat or payment date -->
              <!-- TODO: remove dummy text/ add translations -->
              <app-paymentbreakdowncard
                [statusClass]="{
                  'pending': payment.status === 'Pending',
                  'confirmed': payment.status === 'Confirmed',
                  'rejected': payment.status === 'Rejected',
                }"
                [status]="payment?.status || 'Confirmed'"
                iconUrl="assets/icon/single_payment_blue.svg"
                [amount]="payment?.totalAmount || '999'"
                [currency]="payment?.currency || '$'"
                [paymentMadeOn]="payment?.createdAt || '10/10/2020'"
                [paymentConfirmedOn]="payment?.confirmedDate || '10/10/2020'"
                (onClick)="goToPaymentDetail(payment)"
              >
              </app-paymentbreakdowncard>
            </div>
          </div>
        </div>
      </ion-list>
    </div>
  </ion-grid>
</ion-content>
