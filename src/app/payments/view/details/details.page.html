<app-header [isBackButton]="true"></app-header>

<ion-content class="content-skyblue-bg ion-content-custom-position">
  <app-contentwrapper>
      <app-paymentssummarycard status="{{payment.status}}" title="{{payment.totalAmount}}"
      text="Budi Surname">
      </app-paymentssummarycard>
      <div class="ion-padding-horizontal ion-margin-bottom">
        <app-title [isBlue]="true" title="Payment breakdown" variant="h3"></app-title>
      </div>

      <app-paymentbreakdowncard *ngFor="let paymentBreakdown of paymentBreakdowns" [type]="paymentBreakdown.type"
      [isConfirmable]="paymentBreakdown.confirmed" [madeOn]="paymentBreakdown.madeOn"
      [confirmedOn]="paymentBreakdown.confirmedOn" [amount]="paymentBreakdown.amount"
      [status]="paymentBreakdown.status"></app-paymentbreakdowncard>

    <div class="ion-padding-horizontal">
      <div class="ion-margin-bottom">
          <app-attachment
          pdfName="Payslip"
          pdfInfo="05/10/2022"
          docLink="/assets/imgs/zila1.jpeg"
          backUrl="/workers/details/info"
        ></app-attachment>
      </div>
      <div class="ion-margin-bottom">
        <app-attachment
        pdfName="Payslip"
        pdfInfo="05/10/2022"
        docLink="/assets/imgs/zila1.jpeg"
        backUrl="/workers/details/info"
      ></app-attachment>
      </div>
      <app-button title="Make a new payment to this person"></app-button>
    </div>
  </app-contentwrapper>
</ion-content>
