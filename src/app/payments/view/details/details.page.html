<ion-header>
  <ion-toolbar>
    <ion-title>details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-content>
      <ion-grid>
          <ion-row>
            <ion-col style="text-align:center">
              <ion-icon name="expand-outline" size="large"></ion-icon>
            </ion-col>
            <ion-col size="12" style="text-align: center">
              <ion-text>
                <strong><h2>£123.98</h2></strong>
              </ion-text>
            </ion-col>
            <ion-col size="12" style="text-align: center;">
              <ion-text>
                <h2>Budi Surname</h2>
              </ion-text>
            </ion-col>
            <ion-col size="12" style="text-align: center;">
              <ion-text>
                <h2>Status: Awaiting confirmation</h2>
              </ion-text>
            </ion-col>
          </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>

  <ion-text>
    <strong> <h3 style="margin-left: 20px;">Payment breakdown</h3></strong>
  </ion-text>

  <ion-card *ngFor="let br of breakDown">
    <ion-grid>
      <ion-row>
        <ion-col size="2">
          <ion-icon name="expand-outline" size="large"></ion-icon>
        </ion-col>
        <ion-col size="6">
          <strong>{{br.type}}</strong> <br>
          <strong> {{br.amount}} </strong>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card>


  <ion-card style="margin-top: 50px;">
    <ion-grid>
      <ion-row>
        <ion-col size="2">
          <ion-icon name="expand-outline" size="large"></ion-icon>
        </ion-col>
        <ion-col size="6">
          <strong>Payment Slip</strong> <br>
          <strong> xx/xx/xxxx </strong>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card>

  <ion-button color="light" expand="full">Make a new payment to this person</ion-button>
</ion-content>
